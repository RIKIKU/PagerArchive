# A78's stand-in for a site's reverse proxy, a container on the external
# `proxy` network that reaches the stack only through docs/deploy.md's
# compose.override.yaml. As in the docs' example, but keeping the port in Host,
# as this one has no public hostname. Never for a deployment.
server {
	listen 8080;
	location / {
		proxy_pass http://pagerarchive:8080;
		proxy_set_header Host $http_host;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_http_version 1.1;
		proxy_buffering off;
		proxy_read_timeout 1h;
	}
}
server {
	listen 9000;
	location / {
		proxy_pass http://pagerarchive-authentik:9000;
		proxy_set_header Host $http_host;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_http_version 1.1;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection "upgrade";
	}
}
