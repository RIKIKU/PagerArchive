# A made-up companion app's OIDC clients, for the stack checks only
# (deploy/test/companion.yaml, SPEC.md A150-A151): a second app signing in
# through PagerArchive's Authentik, as RadioArchive does beside it. Each
# client's back-channel logout URL is the test's receiver.
#   companion        its access tokens last 30 days, as R92d says a client
#                    receiving back-channel logout needs
#   companion-short  the same, with 5-second access tokens: Authentik sends
#                    no logout token once they've expired (A150)
version: 1
metadata:
  name: PagerArchive test companion
  labels:
    blueprints.goauthentik.io/description: Made-up OIDC clients for PagerArchive's stack checks
entries:
  - model: authentik_providers_oauth2.oauth2provider
    id: companion
    identifiers:
      name: Test companion
    attrs:
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-invalidation-flow]]
      client_type: confidential
      client_id: companion
      client_secret: test-companion-secret
      redirect_uris:
        - matching_mode: strict
          url: http://companion.example.test/callback
      logout_uri: http://logout-receiver:8026/companion
      logout_method: backchannel
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      sub_mode: user_id
      grant_types: [authorization_code]
      access_code_validity: minutes=1
      access_token_validity: days=30
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
  - model: authentik_core.application
    identifiers:
      slug: companion
    attrs:
      name: Test companion
      provider: !KeyOf companion
      meta_launch_url: blank://blank
      policy_engine_mode: any
  - model: authentik_providers_oauth2.oauth2provider
    id: companion-short
    identifiers:
      name: Test companion, short tokens
    attrs:
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-invalidation-flow]]
      client_type: confidential
      client_id: companion-short
      client_secret: test-companion-secret
      redirect_uris:
        - matching_mode: strict
          url: http://companion.example.test/callback
      logout_uri: http://logout-receiver:8026/companion-short
      logout_method: backchannel
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      sub_mode: user_id
      grant_types: [authorization_code]
      access_code_validity: minutes=1
      access_token_validity: seconds=5
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
  - model: authentik_core.application
    identifiers:
      slug: companion-short
    attrs:
      name: Test companion, short tokens
      provider: !KeyOf companion-short
      meta_launch_url: blank://blank
      policy_engine_mode: any
