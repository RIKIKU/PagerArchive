# Test overlay: the API exports its telemetry to a test collector on the
# host (scripts/test-collector), for A15 with telemetry on (scripts/a15.sh -t).
# Never for a deployment.
services:
  api:
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://host.docker.internal:${PA_TEST_COLLECTOR_PORT:-14320}
    extra_hosts:
      - host.docker.internal:host-gateway
