# Test overlay: the API's image built from this checkout, and a local mail
# catcher instead of a real mail server (SPEC.md section 14). Used by CI and
# the scripts, never in a real deployment:
#   docker compose -f compose.yaml -f deploy/test/compose.yaml --env-file deploy/test/stack.vars up -d
services:
  api:
    image: pagerarchive:${PAGERARCHIVE_VERSION:-stacktest}
    build: .
  mailpit:
    image: axllent/mailpit:v1.33.1
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
    ports:
      - "${MAILPIT_BIND:-127.0.0.1:8025}:8025"
