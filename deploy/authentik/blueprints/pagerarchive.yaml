# PagerArchive: Authentik configuration (SPEC.md R40-R44, ADR 0004).
#
# Applied automatically when mounted under /blueprints in the Authentik
# containers. Reads these environment variables (set in compose.yaml):
#   PA_APP_URL             the app's public URL, e.g. https://pager.example.org
#   PA_OIDC_CLIENT_SECRET  the app's OIDC client secret
#   PA_AUTHENTIK_API_TOKEN the token the app uses for Authentik's API
#
# Enrolment: invitation (created by the app, with the invitee's email fixed)
# -> name and password -> user created inactive -> one-time code emailed to
# the invited address -> user activated -> signed in -> back to the app.
# Sign-in: email and password. Password reset: emailed code.
version: 1
metadata:
  name: PagerArchive
  labels:
    blueprints.goauthentik.io/description: Sign-in, invitation enrolment and password reset for PagerArchive
context:
  app_url: !Env [PA_APP_URL, "http://localhost:8080"]
entries:
  # ---------------------------------------------------------------- prompts
  - model: authentik_stages_prompt.prompt
    id: field-name
    identifiers:
      name: pagerarchive-field-name
    attrs:
      field_key: name
      label: Your name
      type: text
      required: true
      placeholder: Name
      placeholder_expression: false
      initial_value: |
        try:
            return user.name
        except:
            return ''
      initial_value_expression: true
      order: 0
  - model: authentik_stages_prompt.prompt
    id: field-password
    identifiers:
      name: pagerarchive-field-password
    attrs:
      field_key: password
      label: Password
      type: password
      required: true
      placeholder: Password
      placeholder_expression: false
      order: 10
  - model: authentik_stages_prompt.prompt
    id: field-password-repeat
    identifiers:
      name: pagerarchive-field-password-repeat
    attrs:
      field_key: password_repeat
      label: Password (again)
      type: password
      required: true
      placeholder: Password (again)
      placeholder_expression: false
      order: 11

  - model: authentik_policies_password.passwordpolicy
    id: password-policy
    identifiers:
      name: pagerarchive-password-policy
    attrs:
      password_field: password
      check_static_rules: true
      length_min: 10
      amount_digits: 0
      amount_uppercase: 0
      amount_lowercase: 0
      amount_symbols: 0
      check_have_i_been_pwned: false # no third-party calls
      check_zxcvbn: true
      zxcvbn_score_threshold: 2
      error_message: Choose a longer or less guessable password (at least 10 characters).

  # ---------------------------------------------- guessing protection (R44a)
  # After 5 wrong attempts for one account (passwords, password-reset codes
  # and the enrolment code together), attempts are refused for 15 minutes
  # from the 5th, even if the flow is restarted or a new code is requested.
  #
  # Each stage that checks a password or code is bound to "not-locked",
  # which is re-evaluated on every request to it. When the account is
  # locked, the policy marks the flow and fails, so Authentik drops the
  # stage; the deny stage bound right after it (policy "locked", which
  # reads the mark) then refuses. The mark makes the pair decide together,
  # so a check stage can never be dropped without the deny stage running.
  #
  # Failures: wrong passwords and reset codes are Authentik's login_failed
  # events for the account; wrong enrolment codes are counted on the
  # account's email device. A successful sign-in starts the count again.
  - model: authentik_policies_expression.expressionpolicy
    id: not-locked
    identifiers:
      name: pagerarchive-not-locked
    attrs:
      expression: |
        from datetime import timedelta
        from django.utils.timezone import now
        from authentik.events.models import Event, EventAction
        from authentik.stages.authenticator_email.models import EmailDevice

        LIMIT, WINDOW = 5, timedelta(minutes=15)
        user = request.user
        if user is None or getattr(user, "pk", None) is None or user.is_anonymous:
            return True  # no account behind this (an unknown address)
        t = now()
        since = t - 2 * WINDOW
        last_login = (Event.objects.filter(action=EventAction.LOGIN, user__pk=user.pk, created__gt=since)
                      .order_by("-created").values_list("created", flat=True).first())
        if last_login:
            since = last_login
        failures = (Event.objects.filter(action=EventAction.LOGIN_FAILED, context__username=user.username, created__gt=since)
                    .order_by("created").values_list("created", flat=True))
        locked_until, run = None, []
        for f in failures:
            run = [x for x in run if f - x < WINDOW] + [f]
            if len(run) >= LIMIT:
                locked_until, run = f + WINDOW, []
        for d in EmailDevice.objects.filter(user=user):
            ts = d.throttling_failure_timestamp
            if d.throttling_failure_count >= LIMIT and ts is not None:
                locked_until = max(locked_until or ts + WINDOW, ts + WINDOW)
        if locked_until is not None and locked_until > t:
            request.context["flow_plan"].context["pagerarchive_locked"] = True
            return False
        return True
  - model: authentik_policies_expression.expressionpolicy
    id: locked
    identifiers:
      name: pagerarchive-locked
    attrs:
      expression: |
        # Set by pagerarchive-not-locked in the same flow when it refused.
        return bool(request.context["flow_plan"].context.get("pagerarchive_locked"))
  - model: authentik_stages_deny.denystage
    id: too-many-attempts
    identifiers:
      name: pagerarchive-too-many-attempts
    attrs:
      deny_message: Too many wrong attempts for this account. Wait 15 minutes, then try again.

  # -------------------------------------------------------------- enrolment
  - model: authentik_flows.flow
    id: enrolment
    identifiers:
      slug: pagerarchive-enrolment
    attrs:
      name: PagerArchive enrolment
      title: Join PagerArchive
      designation: enrollment
      authentication: require_unauthenticated
  - model: authentik_stages_invitation.invitationstage
    id: enrolment-invitation
    identifiers:
      name: pagerarchive-enrolment-invitation
    attrs:
      continue_flow_without_invitation: false # R41: invitation required
  # The invitation fixes email, username and the app's invitation id; the
  # invitee only chooses a name and password, so the email can't be changed.
  - model: authentik_stages_prompt.promptstage
    id: enrolment-details
    identifiers:
      name: pagerarchive-enrolment-details
    attrs:
      fields:
        - !KeyOf field-name
        - !KeyOf field-password
        - !KeyOf field-password-repeat
      validation_policies:
        - !KeyOf password-policy
  - model: authentik_stages_user_write.userwritestage
    id: enrolment-create
    identifiers:
      name: pagerarchive-enrolment-create
    attrs:
      user_creation_mode: always_create
      create_users_as_inactive: true # active only after the emailed code
      user_type: internal
      user_path_template: users/pagerarchive
  - model: authentik_stages_authenticator_email.authenticatoremailstage
    id: enrolment-code
    identifiers:
      name: pagerarchive-enrolment-code
    attrs:
      friendly_name: Email code
      use_global_settings: true
      token_expiry: minutes=15
      subject: Your PagerArchive code
      template: pagerarchive/code.html # deploy/authentik/templates
  - model: authentik_policies_expression.expressionpolicy
    id: enrolment-activate-policy
    identifiers:
      name: pagerarchive-enrolment-activate
    attrs:
      expression: |
        # Reached only after the emailed code was entered correctly: the next
        # user write activates the user and changes nothing else.
        request.context["flow_plan"].context["prompt_data"] = {"is_active": True}
        return True
  - model: authentik_stages_user_write.userwritestage
    id: enrolment-activate
    identifiers:
      name: pagerarchive-enrolment-activate
    attrs:
      user_creation_mode: never_create
  - model: authentik_stages_user_login.userloginstage
    id: login
    identifiers:
      name: pagerarchive-login
  - model: authentik_stages_redirect.redirectstage
    id: enrolment-to-app
    identifiers:
      name: pagerarchive-enrolment-to-app
    attrs:
      mode: static
      keep_context: false
      target_static: !Format ["%s/auth/login", !Context app_url]

  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf enrolment
      stage: !KeyOf enrolment-invitation
      order: 10
    attrs:
      evaluate_on_plan: true
      re_evaluate_policies: true
  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf enrolment
      stage: !KeyOf enrolment-details
      order: 20
  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf enrolment
      stage: !KeyOf enrolment-create
      order: 30
  - model: authentik_flows.flowstagebinding
    id: enrolment-code-binding
    identifiers:
      target: !KeyOf enrolment
      stage: !KeyOf enrolment-code
      order: 40
    attrs:
      evaluate_on_plan: false
      re_evaluate_policies: true # on every request: each attempt is checked
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf enrolment-code-binding
      policy: !KeyOf not-locked
      order: 0
  - model: authentik_flows.flowstagebinding
    id: enrolment-code-binding-deny
    identifiers:
      target: !KeyOf enrolment
      stage: !KeyOf too-many-attempts
      order: 45
    attrs:
      evaluate_on_plan: false
      re_evaluate_policies: true
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf enrolment-code-binding-deny
      policy: !KeyOf locked
      order: 0
  - model: authentik_flows.flowstagebinding
    id: enrolment-activate-binding
    identifiers:
      target: !KeyOf enrolment
      stage: !KeyOf enrolment-activate
      order: 50
    attrs:
      evaluate_on_plan: false
      re_evaluate_policies: true
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf enrolment-activate-binding
      policy: !KeyOf enrolment-activate-policy
      order: 0
  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf enrolment
      stage: !KeyOf login
      order: 60
  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf enrolment
      stage: !KeyOf enrolment-to-app
      order: 70

  # --------------------------------------------------------- password reset
  - model: authentik_flows.flow
    id: recovery
    identifiers:
      slug: pagerarchive-recovery
    attrs:
      name: PagerArchive password reset
      title: Reset your password
      designation: recovery
      authentication: require_unauthenticated
  - model: authentik_stages_identification.identificationstage
    id: recovery-identification
    identifiers:
      name: pagerarchive-recovery-identification
    attrs:
      user_fields: [email]
      pretend_user_exists: true
  - model: authentik_stages_authenticator_validate.authenticatorvalidatestage
    id: recovery-code
    identifiers:
      name: pagerarchive-recovery-code
    attrs:
      device_classes: [email]
      not_configured_action: deny
      last_auth_threshold: seconds=0
  - model: authentik_stages_prompt.promptstage
    id: recovery-password
    identifiers:
      name: pagerarchive-recovery-password
    attrs:
      fields:
        - !KeyOf field-password
        - !KeyOf field-password-repeat
      validation_policies:
        - !KeyOf password-policy
  - model: authentik_stages_user_write.userwritestage
    id: recovery-write
    identifiers:
      name: pagerarchive-recovery-write
    attrs:
      user_creation_mode: never_create
  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf recovery
      stage: !KeyOf recovery-identification
      order: 10
  - model: authentik_flows.flowstagebinding
    id: recovery-code-binding
    identifiers:
      target: !KeyOf recovery
      stage: !KeyOf recovery-code
      order: 20
    attrs:
      evaluate_on_plan: false
      re_evaluate_policies: true # on every request: each attempt is checked
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf recovery-code-binding
      policy: !KeyOf not-locked
      order: 0
  - model: authentik_flows.flowstagebinding
    id: recovery-code-binding-deny
    identifiers:
      target: !KeyOf recovery
      stage: !KeyOf too-many-attempts
      order: 25
    attrs:
      evaluate_on_plan: false
      re_evaluate_policies: true
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf recovery-code-binding-deny
      policy: !KeyOf locked
      order: 0
  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf recovery
      stage: !KeyOf recovery-password
      order: 30
  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf recovery
      stage: !KeyOf recovery-write
      order: 40
  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf recovery
      stage: !KeyOf login
      order: 50

  # ---------------------------------------------------------------- sign-in
  # Email and password only (owner, 2026-10-13). The email device registered
  # at enrolment is used for password reset, never as a second factor here.
  - model: authentik_flows.flow
    id: authentication
    identifiers:
      slug: pagerarchive-authentication
    attrs:
      name: PagerArchive sign-in
      title: Sign in to PagerArchive
      designation: authentication
      authentication: none
  - model: authentik_stages_password.passwordstage
    id: authentication-password
    identifiers:
      name: pagerarchive-authentication-password
    attrs:
      configure_flow: !Find [authentik_flows.flow, [slug, default-password-change]] # "Change password" in Authentik's user settings
      backends:
        - authentik.core.auth.InbuiltBackend
      failed_attempts_before_cancel: 5
  - model: authentik_stages_identification.identificationstage
    id: authentication-identification
    identifiers:
      name: pagerarchive-authentication-identification
    attrs:
      user_fields: [email]
      password_stage: null # its own stage, so each password attempt is checked (R44a)
      recovery_flow: !KeyOf recovery
      pretend_user_exists: true
  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf authentication
      stage: !KeyOf authentication-identification
      order: 10
  - model: authentik_flows.flowstagebinding
    id: authentication-password-binding
    identifiers:
      target: !KeyOf authentication
      stage: !KeyOf authentication-password
      order: 20
    attrs:
      evaluate_on_plan: false
      re_evaluate_policies: true # on every request: each attempt is checked
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf authentication-password-binding
      policy: !KeyOf not-locked
      order: 0
  - model: authentik_flows.flowstagebinding
    id: authentication-password-binding-deny
    identifiers:
      target: !KeyOf authentication
      stage: !KeyOf too-many-attempts
      order: 25
    attrs:
      evaluate_on_plan: false
      re_evaluate_policies: true
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf authentication-password-binding-deny
      policy: !KeyOf locked
      order: 0
  # Authentik's own administrators (akadmin) also sign in here, and their
  # account can change everything in Authentik: they must use a second
  # factor (an authenticator app, a passkey or recovery codes), set up on
  # first sign-in. PagerArchive users never see this stage.
  - model: authentik_policies_expression.expressionpolicy
    id: authentik-admin
    identifiers:
      name: pagerarchive-authentik-admin
    attrs:
      expression: |
        user = request.user
        return getattr(user, "pk", None) is not None and not user.is_anonymous and user.is_superuser
  - model: authentik_stages_authenticator_validate.authenticatorvalidatestage
    id: admin-second-factor
    identifiers:
      name: pagerarchive-authentik-admin-second-factor
    attrs:
      device_classes: [totp, webauthn, static]
      not_configured_action: configure
      configuration_stages:
        - !Find [authentik_stages_authenticator_totp.authenticatortotpstage, [name, default-authenticator-totp-setup]]
      last_auth_threshold: seconds=0
  - model: authentik_flows.flowstagebinding
    id: admin-second-factor-binding
    identifiers:
      target: !KeyOf authentication
      stage: !KeyOf admin-second-factor
      order: 30
    attrs:
      evaluate_on_plan: false
      re_evaluate_policies: true
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf admin-second-factor-binding
      policy: !KeyOf authentik-admin
      order: 0
  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf authentication
      stage: !KeyOf login
      order: 100

  # ---------------------------------------------------------- user settings
  # Name only: the email address can't be changed, because it's what the
  # invitation and the allowed domains (R41) were checked against.
  - model: authentik_flows.flow
    id: user-settings
    identifiers:
      slug: pagerarchive-user-settings
    attrs:
      name: PagerArchive user settings
      title: Your details
      designation: stage_configuration
      authentication: require_authenticated
  - model: authentik_stages_prompt.promptstage
    id: user-settings-prompt
    identifiers:
      name: pagerarchive-user-settings
    attrs:
      fields:
        - !KeyOf field-name
  - model: authentik_stages_user_write.userwritestage
    id: user-settings-write
    identifiers:
      name: pagerarchive-user-settings-write
    attrs:
      user_creation_mode: never_create
  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf user-settings
      stage: !KeyOf user-settings-prompt
      order: 10
  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf user-settings
      stage: !KeyOf user-settings-write
      order: 20

  - model: authentik_brands.brand
    identifiers:
      domain: authentik-default
    attrs:
      default: true
      branding_title: PagerArchive
      flow_authentication: !KeyOf authentication
      flow_recovery: !KeyOf recovery
      flow_user_settings: !KeyOf user-settings
      flow_enrollment: null

  # ------------------------------------------------------------------ OIDC
  - model: authentik_providers_oauth2.scopemapping
    id: scope-pagerarchive
    identifiers:
      managed: goauthentik.io/pagerarchive/scope
    attrs:
      name: "PagerArchive: invitation"
      scope_name: pagerarchive
      description: Which PagerArchive invitation you enrolled with
      expression: |
        return {"pagerarchive_invitation": request.user.attributes.get("pagerarchive_invitation")}
  - model: authentik_providers_oauth2.oauth2provider
    id: provider
    identifiers:
      name: PagerArchive
    attrs:
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      client_type: confidential
      client_id: pagerarchive
      client_secret: !Env PA_OIDC_CLIENT_SECRET
      redirect_uris:
        - matching_mode: strict
          url: !Format ["%s/auth/callback", !Context app_url]
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      sub_mode: user_id
      grant_types: [authorization_code]
      include_claims_in_id_token: true
      access_code_validity: minutes=1
      access_token_validity: minutes=5
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
        - !KeyOf scope-pagerarchive
  - model: authentik_core.application
    identifiers:
      slug: pagerarchive
    attrs:
      name: PagerArchive
      provider: !KeyOf provider
      meta_launch_url: !Context app_url
      policy_engine_mode: any

  # ------------------------------------------------- the app's API account
  # Least privilege: invitations, and enabling, disabling and deleting users.
  - model: authentik_rbac.role
    id: api-role
    identifiers:
      name: PagerArchive API
    attrs:
      permissions:
        - authentik_flows.view_flow
        - authentik_stages_invitation.add_invitation
        - authentik_stages_invitation.view_invitation
        - authentik_stages_invitation.change_invitation
        - authentik_stages_invitation.delete_invitation
        - authentik_core.view_user
        - authentik_core.change_user
        - authentik_core.delete_user
  - model: authentik_core.group
    id: api-group
    identifiers:
      name: PagerArchive API
    attrs:
      is_superuser: false
      roles:
        - !KeyOf api-role
  - model: authentik_core.user
    id: api-user
    identifiers:
      username: pagerarchive-api
    attrs:
      name: PagerArchive API
      type: service_account
      path: users/service
      groups:
        - !KeyOf api-group
  - model: authentik_core.token
    identifiers:
      identifier: pagerarchive-api
    attrs:
      intent: api
      expiring: false
      user: !KeyOf api-user
      key: !Env PA_AUTHENTIK_API_TOKEN
