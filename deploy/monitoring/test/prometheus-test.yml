# Tests only (A119): prometheus/prometheus.yml, plus samples up to 9 days
# old, so the test can give its made-up clients the days of history "Radio
# not decoding" compares with. A deployment's Prometheus takes only samples
# as they come.
global:
  evaluation_interval: 30s
storage:
  tsdb:
    out_of_order_time_window: 9d
