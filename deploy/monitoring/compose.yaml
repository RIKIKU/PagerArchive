# Example monitoring stack for PagerArchive (SPEC.md R76, docs/monitoring.md):
# Grafana Alloy collects, Tempo keeps traces, Loki logs, Prometheus metrics,
# and Grafana shows them, with dashboards and alert rules provisioned from
# the files here. Upstream's images, unchanged, by their major.minor tags (R84).
# Alloy, Tempo and Prometheus publish no such tag, so they name an exact version
# (ADR 0019). The files come from the release's pagerarchive-config.tar.gz.
#
# It's a separate application that other apps can use too, so it owns a Docker
# network named `monitoring`, and each app joins it with a compose.override.yaml
# of its own (R76, docs/monitoring.md). That's how Alloy scrapes the API's
# /metrics and the API sends it OTLP. Start this stack first: the network has to
# exist. In the archive's deploy/monitoring folder, this file saved as
# compose.yaml and monitoring-env.example as .env, with GRAFANA_ADMIN_PASSWORD and
# PA_METRICS_TOKEN set:
#
#   docker compose up -d
#
# LAN only: Grafana's port is the only one published. Of this stack, only Alloy
# is on `monitoring`; everything else talks on its own internal network.
# Receiving clients on other machines need Alloy's OTLP port too: see
# docs/monitoring.md.
#
# Each service's pagerarchive.config label is a hash of the files it mounts.
# Compose doesn't notice a changed file, but a changed label makes `docker
# compose up -d` recreate the container, so a release's new files take effect
# (R84a, ADR 0019). A test checks it and prints the right value. Files are
# mounted one by one, so one a later release drops can't stay in use.
name: pagerarchive-monitoring

services:
  alloy:
    image: grafana/alloy:v1.21.3
    restart: unless-stopped
    command: [run, /etc/alloy/config.alloy, --storage.path=/var/lib/alloy, --server.http.listen-addr=0.0.0.0:12345, --disable-reporting]
    labels:
      pagerarchive.config: "12f8cf5704637605"
    environment:
      # The metrics bearer token the API's METRICS_TOKEN is set to (R75).
      PA_METRICS_TOKEN: ${PA_METRICS_TOKEN:?set PA_METRICS_TOKEN in .env}
      # Where the API is, on the monitoring network: the alias its override gives it.
      PA_API_ADDRESS: ${PA_API_ADDRESS:-pagerarchive:8080}
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - alloy:/var/lib/alloy
    networks: [internal, monitoring]
    depends_on: [tempo, loki, prometheus]

  tempo:
    image: grafana/tempo:3.1.1
    restart: unless-stopped
    command: [-config.file=/etc/tempo/tempo.yaml]
    labels:
      pagerarchive.config: "d06b9a218f197049"
    volumes:
      - ./tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo:/var/tempo
    networks: [internal]

  loki:
    image: grafana/loki:3.7
    restart: unless-stopped
    command: [-config.file=/etc/loki/loki.yaml]
    labels:
      pagerarchive.config: "524134de2eb74e1e"
    volumes:
      - ./loki/loki.yaml:/etc/loki/loki.yaml:ro
      - loki:/loki
    networks: [internal]

  prometheus:
    image: prom/prometheus:v3.15.1
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${METRICS_RETENTION:-30d}
      # Alloy pushes what it scrapes and receives (remote write), with
      # exemplars: the trace IDs of sample requests.
      - --web.enable-remote-write-receiver
      - --enable-feature=exemplar-storage
    labels:
      pagerarchive.config: "d43a00d048eb02f3"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus:/prometheus
    networks: [internal]

  grafana:
    image: grafana/grafana:13.2
    restart: unless-stopped
    labels:
      pagerarchive.config: "d5073036a598aaba"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
      # Grafana shows client and user IDs: admins only, no anonymous access,
      # no sign-up (R76).
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost:3000}
      # Nothing leaves the LAN: no usage reports, update checks, news or
      # plugin downloads.
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
    volumes:
      - ./grafana/provisioning/datasources/datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml:ro
      - ./grafana/provisioning/dashboards/dashboards.yaml:/etc/grafana/provisioning/dashboards/dashboards.yaml:ro
      - ./grafana/provisioning/alerting/rules.yaml:/etc/grafana/provisioning/alerting/rules.yaml:ro
      - ./grafana/dashboards/backups.json:/var/lib/grafana/dashboards/backups.json:ro
      - ./grafana/dashboards/clients.json:/var/lib/grafana/dashboards/clients.json:ro
      - ./grafana/dashboards/page-path.json:/var/lib/grafana/dashboards/page-path.json:ro
      - ./grafana/dashboards/requests.json:/var/lib/grafana/dashboards/requests.json:ro
      - grafana:/var/lib/grafana
    ports:
      - "${GRAFANA_BIND:-127.0.0.1:3000}:3000"
    # An internal network can't publish a port, so Grafana alone also joins
    # an ordinary one.
    networks: [internal, grafana]
    depends_on: [tempo, loki, prometheus]

networks:
  # No way out: Tempo, Loki and Prometheus reach nothing but each other.
  internal:
    internal: true
  grafana:
  # The one other apps join: not prefixed with this project's name, so their
  # overrides can name it. Only Alloy is on it, so they can send it telemetry
  # and be scraped, and nothing else here can be reached from them.
  monitoring:
    name: monitoring

volumes:
  alloy:
  tempo:
  loki:
  prometheus:
  grafana:
