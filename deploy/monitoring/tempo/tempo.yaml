# Tempo, single process, traces on the local disk (the tempo volume).
server:
  http_listen_port: 3200
  log_level: warn

# OTLP from Alloy only: this port isn't published.
distributor:
  receivers:
    otlp:
      protocols:
        http:
          endpoint: 0.0.0.0:4318

ingester:
  max_block_duration: 5m

# Traces are kept 7 days (R76).
compactor:
  compaction:
    block_retention: 168h

# Metrics from traces, kept in Tempo itself, so the dashboards can ask
# "requests by user ID" and "time in each step" with TraceQL (local-blocks).
metrics_generator:
  storage:
    path: /var/tempo/generator/wal
  traces_storage:
    path: /var/tempo/generator/traces
  processor:
    local_blocks:
      filter_server_spans: false
      flush_to_storage: true

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

overrides:
  defaults:
    metrics_generator:
      processors: [local-blocks]

usage_report:
  reporting_enabled: false
