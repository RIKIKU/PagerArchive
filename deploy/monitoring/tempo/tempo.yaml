# Tempo 3, single process (all of Tempo in one program, no Kafka), traces
# on the local disk (the tempo volume). The dashboards' TraceQL metrics
# ("requests by user ID", "time in each step") are answered from the
# stored traces themselves; Tempo 3 needs no metrics-generator for them.
server:
  http_listen_port: 3200
  log_level: warn

# OTLP from Alloy only: this port isn't published.
distributor:
  receivers:
    otlp:
      protocols:
        http:
          endpoint: 0.0.0.0:4318

# Traces are kept 7 days (R76). The backend scheduler plans the deletions
# and the backend worker carries them out; both read a retention, so both
# are set.
backend_scheduler:
  provider:
    compaction:
      compaction:
        block_retention: 168h
backend_worker:
  compaction:
    block_retention: 168h

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

usage_report:
  reporting_enabled: false
