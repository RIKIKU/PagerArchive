# One data source per store, linked to each other (R76):
#   a log line's trace ID opens the trace in Tempo;
#   a span opens its logs in Loki;
#   a request-duration exemplar in Prometheus opens its trace.
apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    jsonData:
      timeInterval: 15s
      # A URL rather than a link to the Tempo data source: Grafana opens a
      # data source link at Explore's default "Last 1 hour", and a URL can
      # carry the dashboard's time range.
      exemplarTraceIdDestinations:
        - name: trace_id
          url: '/explore?schemaVersion=1&orgId=1&panes={"a":{"datasource":"tempo","queries":[{"refId":"A","datasource":{"type":"tempo","uid":"tempo"},"queryType":"traceql","query":"$${__value.raw}"}],"range":{"from":"$${__from}","to":"$${__to}"}}}'
          urlDisplayLabel: Open the trace (this time range)

  - name: Tempo
    uid: tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    jsonData:
      tracesToLogsV2:
        datasourceUid: loki
        filterByTraceID: true
        spanStartTimeShift: -5m
        spanEndTimeShift: 5m
        customQuery: false
      nodeGraph:
        enabled: true
      search:
        hide: false
      # A trace opened by its ID is looked for in all of Tempo's retention,
      # not only Explore's time range: Grafana's own trace links (a table's
      # span ID, a TraceQL dot, a log line's trace) open Explore at "Last 1
      # hour", and a trace older than that would otherwise not be found.
      traceQuery:
        timeShiftEnabled: false

  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    jsonData:
      derivedFields:
        # The trace ID Loki keeps with each OTLP log line.
        - name: Trace
          matcherType: label
          matcherRegex: trace_id
          datasourceUid: tempo
          url: "$${__value.raw}"
          urlDisplayLabel: Open the trace
