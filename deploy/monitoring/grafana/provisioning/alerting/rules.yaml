# Alert rules (R76). They go to the default notification policy, so they
# reach whatever contact point you choose for it in Grafana (email,
# Pushover, ...: docs/monitoring.md). Each resolves on its own when the
# problem is fixed.
apiVersion: 1

groups:
  - orgId: 1
    name: PagerArchive
    folder: PagerArchive
    interval: 30s
    rules:
      # R39: a client is "not receiving" after 30 minutes with no page of
      # any kind. One alert per client; it clears when the client is heard
      # again.
      - uid: pa-client-not-receiving
        title: Client not receiving
        condition: quiet
        data:
          - refId: seconds
            relativeTimeRange: {from: 300, to: 0}
            datasourceUid: prometheus
            model:
              refId: seconds
              instant: true
              range: false
              expr: time() - max by (client) (pagerarchive_client_last_seen_timestamp_seconds{job="pagerarchive"})
          - refId: quiet
            datasourceUid: __expr__
            model:
              refId: quiet
              type: threshold
              expression: seconds
              conditions:
                - evaluator:
                    type: gt
                    # THE THRESHOLD SETTING: seconds without a page from a
                    # client before it alerts (R39: 30 minutes). Change it
                    # here and restart Grafana (docs/monitoring.md).
                    params: [1800]
        # While the API itself is down there are no last-seen times: that's
        # the other alert's job.
        noDataState: OK
        execErrState: Error
        for: 0s
        labels:
          severity: warning
        annotations:
          summary: "Client {{ $labels.client }} has sent nothing for {{ humanizeDuration $values.seconds.Value }}"
          description: >-
            No page of any kind (heartbeats included) from this receiving
            client for longer than the threshold. Check its radio and its
            connection: the "PagerArchive: clients" dashboard shows whether
            it still reads lines and whether its sends fail.

      # R86a: the last backup failed, or the last good one is more than 36 hours
      # old. The API works that out, as Administration shows the same thing.
      # It clears after the next good backup. While the API is down there's no
      # value: that's "API unreachable"'s job.
      - uid: pa-backup-failing
        title: Backup failing
        condition: failing
        data:
          - refId: state
            relativeTimeRange: {from: 300, to: 0}
            datasourceUid: prometheus
            model:
              refId: state
              instant: true
              range: false
              expr: max(pagerarchive_backup_failing{job="pagerarchive"})
          - refId: failing
            datasourceUid: __expr__
            model:
              refId: failing
              type: threshold
              expression: state
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
        noDataState: OK
        execErrState: Error
        for: 0s
        labels:
          severity: critical
        annotations:
          summary: "The nightly backup failed, or the last good one is more than 36 hours old"
          description: >-
            Administration's Backups page says which and why, and when the last
            good backup was. docs/deploy.md, "Backups".

      # R84h: an automatic upgrade failed, and was rolled back (or the rollback
      # failed too), or a run stopped part way. The API works that out from
      # the upgrades' status file, as Administration shows the same thing. It
      # clears when a later release upgrades, or after `auto-upgrade.sh clear`.
      # The same contact point as every other alert: no new channel.
      - uid: pa-upgrade-failed
        title: Upgrade failed
        condition: failing
        data:
          - refId: state
            relativeTimeRange: {from: 300, to: 0}
            datasourceUid: prometheus
            model:
              refId: state
              instant: true
              range: false
              expr: max(pagerarchive_auto_upgrade_failing{job="pagerarchive"})
          - refId: failing
            datasourceUid: __expr__
            model:
              refId: failing
              type: threshold
              expression: state
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
        noDataState: OK
        execErrState: Error
        for: 0s
        labels:
          severity: warning
        annotations:
          summary: "An automatic upgrade failed and was rolled back, or needs you"
          description: >-
            Administration's Upgrades page says which release, at which step
            and why, and whether the database was restored. Loki has each
            step: {service_name="pagerarchive-auto-upgrade"}. docs/deploy.md,
            "Automatic upgrades".

      # R74a: a client running the radio has had no audio from rtl_fm for 2
      # minutes. rtl_fm runs without squelch, so a working dongle always
      # gives audio: none means the dongle is stuck, or the pipeline isn't
      # running (it gives no audio either). The client counts the seconds
      # itself, so the alert follows only clients that are still reporting:
      # one that's switched off is "Client not receiving"'s job. One alert
      # per client; it clears when audio flows again.
      - uid: pa-radio-stalled
        title: Radio stalled
        condition: stalled
        data:
          - refId: silent
            relativeTimeRange: {from: 300, to: 0}
            datasourceUid: prometheus
            model:
              refId: silent
              instant: true
              range: false
              expr: max by (client) (label_replace(pagerarchive_client_radio_silent_seconds, "client", "$1", "instance", "(.*)"))
          - refId: stalled
            datasourceUid: __expr__
            model:
              refId: stalled
              type: threshold
              expression: silent
              conditions:
                - evaluator:
                    type: gt
                    # THE THRESHOLD SETTING: seconds without audio from a
                    # client's radio before it alerts (R74a: 2 minutes).
                    # Change it here and restart Grafana (docs/monitoring.md).
                    params: [120]
        # No numbers: no client runs the radio, or none is reporting.
        noDataState: OK
        execErrState: Error
        for: 0s
        labels:
          severity: warning
        annotations:
          summary: "Client {{ $labels.client }}'s radio has given no audio for {{ humanizeDuration $values.silent.Value }}"
          description: >-
            rtl_fm runs without squelch, so a working dongle always gives
            audio, even from a quiet channel. None means the dongle is stuck
            (reset it: unplug it, or restart the client) or rtl_fm isn't
            running. The "PagerArchive: clients" dashboard shows the
            client's radio health and rtl_fm's errors by kind.

      # R76: the API can't be scraped: it's down, or unreachable from Alloy.
      - uid: pa-api-unreachable
        title: API unreachable
        condition: down
        data:
          - refId: up
            relativeTimeRange: {from: 300, to: 0}
            datasourceUid: prometheus
            model:
              refId: up
              instant: true
              range: false
              expr: max(up{job="pagerarchive"})
          - refId: down
            datasourceUid: __expr__
            model:
              refId: down
              type: threshold
              expression: up
              conditions:
                - evaluator: {type: lt, params: [1]}
        # No "up" at all means Alloy itself isn't sending: alert too.
        noDataState: Alerting
        execErrState: Alerting
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: PagerArchive's API can't be scraped
          description: >-
            Alloy's scrape of /metrics is failing: the API is down, or
            unreachable from the monitoring stack, or METRICS_TOKEN changed.
