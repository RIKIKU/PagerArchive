# Alert rules (R76). They go to the default notification policy, so they
# reach whatever contact point you choose for it in Grafana (email,
# Pushover, ...: docs/monitoring.md). Each resolves on its own when the
# problem is fixed.
apiVersion: 1

groups:
  - orgId: 1
    name: PagerArchive
    folder: PagerArchive
    interval: 30s
    rules:
      # R39: a client is "not receiving" after 30 minutes with no page of
      # any kind. One alert per client; it clears when the client is heard
      # again.
      - uid: pa-client-not-receiving
        title: Client not receiving
        condition: quiet
        data:
          - refId: seconds
            relativeTimeRange: {from: 300, to: 0}
            datasourceUid: prometheus
            model:
              refId: seconds
              instant: true
              range: false
              expr: time() - max by (client) (pagerarchive_client_last_seen_timestamp_seconds{job="pagerarchive"})
          - refId: quiet
            datasourceUid: __expr__
            model:
              refId: quiet
              type: threshold
              expression: seconds
              conditions:
                - evaluator:
                    type: gt
                    # THE THRESHOLD SETTING: seconds without a page from a
                    # client before it alerts (R39: 30 minutes). Change it
                    # here and restart Grafana (docs/monitoring.md).
                    params: [1800]
        # While the API itself is down there are no last-seen times: that's
        # the other alert's job.
        noDataState: OK
        execErrState: Error
        for: 0s
        labels:
          severity: warning
        annotations:
          summary: "Client {{ $labels.client }} has sent nothing for {{ humanizeDuration $values.seconds.Value }}"
          description: >-
            No page of any kind (heartbeats included) from this receiving
            client for longer than the threshold. Check its radio and its
            connection: the "Clients" dashboard (in the PagerArchive folder) shows whether
            it still reads lines and whether its sends fail.

      # R86a: the last backup failed, or the last good one is more than 36 hours
      # old. The API works that out, as Administration shows the same thing.
      # It clears after the next good backup. While the API is down there's no
      # value: that's "API unreachable"'s job.
      - uid: pa-backup-failing
        title: Backup failing
        condition: failing
        data:
          - refId: state
            relativeTimeRange: {from: 300, to: 0}
            datasourceUid: prometheus
            model:
              refId: state
              instant: true
              range: false
              expr: max(pagerarchive_backup_failing{job="pagerarchive"})
          - refId: failing
            datasourceUid: __expr__
            model:
              refId: failing
              type: threshold
              expression: state
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
        noDataState: OK
        execErrState: Error
        for: 0s
        labels:
          severity: critical
        annotations:
          summary: "The nightly backup failed, or the last good one is more than 36 hours old"
          description: >-
            Administration's Backups page says which and why, and when the last
            good backup was. docs/deploy.md, "Backups".

      # R84h: an automatic upgrade failed, and was rolled back (or the rollback
      # failed too), or a run stopped part way. The API works that out from
      # the upgrades' status file, as Administration shows the same thing. It
      # clears when a later release upgrades, or after `auto-upgrade.sh clear`.
      # The same contact point as every other alert: no new channel.
      - uid: pa-upgrade-failed
        title: Upgrade failed
        condition: failing
        data:
          - refId: state
            relativeTimeRange: {from: 300, to: 0}
            datasourceUid: prometheus
            model:
              refId: state
              instant: true
              range: false
              expr: max(pagerarchive_auto_upgrade_failing{job="pagerarchive"})
          - refId: failing
            datasourceUid: __expr__
            model:
              refId: failing
              type: threshold
              expression: state
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
        noDataState: OK
        execErrState: Error
        for: 0s
        labels:
          severity: warning
        annotations:
          summary: "An automatic upgrade failed and was rolled back, or needs you"
          description: >-
            Administration's Upgrades page says which release, at which step
            and why, and whether the database was restored. Loki has each
            step: {service_name="pagerarchive-auto-upgrade"}. docs/deploy.md,
            "Automatic upgrades".

      # R84c, ADR 0033: the database image provides a newer version of an
      # extension (PostGIS's, or pg_trgm) than the database has registered.
      # A switched API isn't the superuser, so it can't run the update: that
      # stays a hand step (owner, 2026-11-19). The API checks at start and
      # every hour. One alert per extension; it clears at the API's next check
      # after the update (or at once if the API is restarted). No series (the
      # metrics off, or the API down) is OK: that's "API unreachable"'s job.
      - uid: pa-db-extension-update-pending
        title: Database extension update pending
        condition: pending
        data:
          - refId: state
            relativeTimeRange: {from: 300, to: 0}
            datasourceUid: prometheus
            model:
              refId: state
              instant: true
              range: false
              expr: max by (extension) (pagerarchive_db_extension_update_pending{job="pagerarchive"})
          - refId: pending
            datasourceUid: __expr__
            model:
              refId: pending
              type: threshold
              expression: state
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
        noDataState: OK
        execErrState: Error
        for: 0s
        labels:
          severity: warning
        annotations:
          summary: "The database image has a newer {{ $labels.extension }} than the database: run its update by hand"
          description: >-
            A newer database image brought a newer version of this extension,
            but the database still has the old one registered, and the API's
            own role can't update it. The API works on the old version, so
            nothing is broken, but this is a hand step: on the server, in the
            install's folder, run this as the superuser:
            `docker compose exec db psql -U postgres -c 'ALTER EXTENSION {{ $labels.extension }} UPDATE;'`
            (with several pending, postgis first).
            It clears within the hour, or at once if you restart the API
            (`docker compose restart api`). docs/deploy.md, "Upgrading".

      # R74a: a client running the radio has had no audio from rtl_fm for 2
      # minutes. rtl_fm runs without squelch, so a working dongle always
      # gives audio: none means the dongle is stuck, or the pipeline isn't
      # running (it gives no audio either). The client counts the seconds
      # itself, so the alert follows only clients that are still reporting:
      # one that's switched off is "Client not receiving"'s job. One alert
      # per client; it clears when audio flows again.
      - uid: pa-radio-stalled
        title: Radio stalled
        condition: stalled
        data:
          - refId: silent
            relativeTimeRange: {from: 300, to: 0}
            datasourceUid: prometheus
            model:
              refId: silent
              instant: true
              range: false
              expr: max by (client) (label_replace(pagerarchive_client_radio_silent_seconds, "client", "$1", "instance", "(.*)"))
          - refId: stalled
            datasourceUid: __expr__
            model:
              refId: stalled
              type: threshold
              expression: silent
              conditions:
                - evaluator:
                    type: gt
                    # THE THRESHOLD SETTING: seconds without audio from a
                    # client's radio before it alerts (R74a: 2 minutes).
                    # Change it here and restart Grafana (docs/monitoring.md).
                    params: [120]
        # No numbers: no client runs the radio, or none is reporting.
        noDataState: OK
        execErrState: Error
        for: 0s
        labels:
          severity: warning
        annotations:
          summary: "Client {{ $labels.client }}'s radio has given no audio for {{ humanizeDuration $values.silent.Value }}"
          description: >-
            rtl_fm runs without squelch, so a working dongle always gives
            audio, even from a quiet channel. None means the dongle is stuck
            (reset it: unplug it, or restart the client) or rtl_fm isn't
            running. The "Clients" dashboard (in the PagerArchive folder) shows the
            client's radio health and rtl_fm's errors by kind.

      # R74b: a client's radio gives audio, but it decodes far fewer pages
      # than it usually does at this time of day: a weak or detuned signal,
      # a gain that's wrong, or a decoder that has lost the plot. "Radio
      # stalled" can't see it (audio flows) and "Client not receiving" can't
      # either while a page, garbled or not, still gets through every half
      # hour. "Usually" is the client's own count for the same half hour on
      # each of the 7 days before (the days it has), so it follows a
      # network's quiet nights and busy days with no number about the
      # network in it. Pages are counted as the client decoded them, garbled
      # ones too (ADR 0039). One alert per client; it clears when decoding
      # is back above half the usual.
      - uid: pa-radio-not-decoding
        title: Radio not decoding
        condition: down
        data:
          # The pages the client decoded in the last 30 minutes, for clients
          # whose radio gives audio: about 44,100 bytes a second (rtl_fm's
          # 22,050 samples), so not "Radio stalled"'s case.
          - refId: decoded
            relativeTimeRange: {from: 1800, to: 0}
            datasourceUid: prometheus
            model:
              refId: decoded
              instant: true
              range: false
              # THE THRESHOLD SETTING (1 of 3): the window, 30m here and in
              # each of usual's 21 lines (7 in each of its 3 parts); change
              # them together.
              expr: >-
                sum by (client) (label_replace(increase(pagerarchive_client_pages_decoded_total[30m]), "client", "$1", "instance", "(.*)"))
                and on (client)
                (sum by (client) (label_replace(rate(pagerarchive_client_radio_audio_bytes_total[5m]), "client", "$1", "instance", "(.*)")) > 40000)
          # What the client usually decodes in those 30 minutes: its average
          # for the same 30 minutes on each of the 7 days before, the busiest
          # of them left out (ADR 0039, 2026-11-19), so one busy day doesn't
          # make a normal half hour look like a fault. That's the 7 days'
          # sum less their largest, over their count less one. A day it has
          # no numbers for (it's new) isn't counted; with fewer than two
          # there's no usual (0 / 0), and no alert.
          - refId: usual
            relativeTimeRange: {from: 1800, to: 0}
            datasourceUid: prometheus
            model:
              refId: usual
              instant: true
              range: false
              # THE THRESHOLD SETTING (2 of 3): the floor. Below 20 usual
              # pages in the window, a quarter of it is too few pages to
              # tell a fault from a quiet spell, so there's no alert: a
              # quiet network, or a quiet hour, is left to "Client not
              # receiving".
              expr: >-
                (
                  sum by (client) (label_replace(
                    label_replace(sum by (instance) (increase(pagerarchive_client_pages_decoded_total[30m] offset 1d)), "day", "1", "", "")
                    or label_replace(sum by (instance) (increase(pagerarchive_client_pages_decoded_total[30m] offset 2d)), "day", "2", "", "")
                    or label_replace(sum by (instance) (increase(pagerarchive_client_pages_decoded_total[30m] offset 3d)), "day", "3", "", "")
                    or label_replace(sum by (instance) (increase(pagerarchive_client_pages_decoded_total[30m] offset 4d)), "day", "4", "", "")
                    or label_replace(sum by (instance) (increase(pagerarchive_client_pages_decoded_total[30m] offset 5d)), "day", "5", "", "")
                    or label_replace(sum by (instance) (increase(pagerarchive_client_pages_decoded_total[30m] offset 6d)), "day", "6", "", "")
                    or label_replace(sum by (instance) (increase(pagerarchive_client_pages_decoded_total[30m] offset 7d)), "day", "7", "", ""),
                    "client", "$1", "instance", "(.*)"))
                  - max by (client) (label_replace(
                    label_replace(sum by (instance) (increase(pagerarchive_client_pages_decoded_total[30m] offset 1d)), "day", "1", "", "")
                    or label_replace(sum by (instance) (increase(pagerarchive_client_pages_decoded_total[30m] offset 2d)), "day", "2", "", "")
                    or label_replace(sum by (instance) (increase(pagerarchive_client_pages_decoded_total[30m] offset 3d)), "day", "3", "", "")
                    or label_replace(sum by (instance) (increase(pagerarchive_client_pages_decoded_total[30m] offset 4d)), "day", "4", "", "")
                    or label_replace(sum by (instance) (increase(pagerarchive_client_pages_decoded_total[30m] offset 5d)), "day", "5", "", "")
                    or label_replace(sum by (instance) (increase(pagerarchive_client_pages_decoded_total[30m] offset 6d)), "day", "6", "", "")
                    or label_replace(sum by (instance) (increase(pagerarchive_client_pages_decoded_total[30m] offset 7d)), "day", "7", "", ""),
                    "client", "$1", "instance", "(.*)"))
                )
                / (count by (client) (label_replace(
                    label_replace(sum by (instance) (increase(pagerarchive_client_pages_decoded_total[30m] offset 1d)), "day", "1", "", "")
                    or label_replace(sum by (instance) (increase(pagerarchive_client_pages_decoded_total[30m] offset 2d)), "day", "2", "", "")
                    or label_replace(sum by (instance) (increase(pagerarchive_client_pages_decoded_total[30m] offset 3d)), "day", "3", "", "")
                    or label_replace(sum by (instance) (increase(pagerarchive_client_pages_decoded_total[30m] offset 4d)), "day", "4", "", "")
                    or label_replace(sum by (instance) (increase(pagerarchive_client_pages_decoded_total[30m] offset 5d)), "day", "5", "", "")
                    or label_replace(sum by (instance) (increase(pagerarchive_client_pages_decoded_total[30m] offset 6d)), "day", "6", "", "")
                    or label_replace(sum by (instance) (increase(pagerarchive_client_pages_decoded_total[30m] offset 7d)), "day", "7", "", ""),
                    "client", "$1", "instance", "(.*)")) - 1)
                >= 20
          - refId: share
            datasourceUid: __expr__
            model:
              refId: share
              type: math
              expression: $decoded / $usual
          - refId: down
            datasourceUid: __expr__
            model:
              refId: down
              type: threshold
              expression: share
              conditions:
                - evaluator:
                    type: lt
                    # THE THRESHOLD SETTING (3 of 3): it fires below a
                    # quarter of the usual (0.25) and clears above half
                    # (0.5), so a client hovering near one line doesn't
                    # fire and clear over and over. Change them here and
                    # restart Grafana (docs/monitoring.md).
                    params: [0.25]
                  unloadEvaluator:
                    type: gt
                    params: [0.5]
        # No share: no client gives audio with a usual worth comparing (a new
        # client, a quiet network, a stalled radio, or a client that's off):
        # each is another rule's job, or nobody's.
        noDataState: OK
        execErrState: Error
        # 5 minutes below the line before it fires: a short lull isn't a fault.
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Client {{ $labels.client }} decoded {{ printf \"%.0f\" $values.decoded.Value }} pages in the last 30 minutes; it usually decodes {{ printf \"%.0f\" $values.usual.Value }} then"
          description: >-
            The radio gives audio, so the dongle works, but far fewer pages
            come out of it than usual for this time of day. Look at the
            "Clients" dashboard (in the PagerArchive folder): its audio level
            and "Pages decoded: the last 30 minutes against the usual".
            Usually the signal: the antenna and its cable, RADIO_GAIN (a
            fixed gain set too low or too high) and RADIO_PPM. A restart of
            the client (docker restart) is worth a try. If another receiver
            hears the network as quiet too, it's the network.

      # R76: the API can't be scraped: it's down, or unreachable from Alloy.
      - uid: pa-api-unreachable
        title: API unreachable
        condition: down
        data:
          - refId: up
            relativeTimeRange: {from: 300, to: 0}
            datasourceUid: prometheus
            model:
              refId: up
              instant: true
              range: false
              expr: max(up{job="pagerarchive"})
          - refId: down
            datasourceUid: __expr__
            model:
              refId: down
              type: threshold
              expression: up
              conditions:
                - evaluator: {type: lt, params: [1]}
        # No "up" at all means Alloy itself isn't sending: alert too.
        noDataState: Alerting
        execErrState: Alerting
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: PagerArchive's API can't be scraped
          description: >-
            Alloy's scrape of /metrics is failing: the API is down, or
            unreachable from the monitoring stack, or METRICS_TOKEN changed.

      # R89a: Authentik's server or worker can't be scraped: it's down, or
      # unreachable from Alloy over the monitoring-authentik network. While
      # the server is down nobody can sign in; while the worker is, no email
      # goes out. One alert per part (instance: server or worker). With
      # Authentik's addresses set to "" the stack scrapes nothing: no data, OK.
      - uid: pa-authentik-down
        title: Authentik down
        condition: down
        data:
          - refId: up
            relativeTimeRange: {from: 300, to: 0}
            datasourceUid: prometheus
            model:
              refId: up
              instant: true
              range: false
              expr: max by (instance) (up{job="authentik"})
          - refId: down
            datasourceUid: __expr__
            model:
              refId: down
              type: threshold
              expression: up
              conditions:
                - evaluator: {type: lt, params: [1]}
        noDataState: OK
        execErrState: Error
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Authentik's {{ $labels.instance }} can't be reached"
          description: >-
            The monitoring stack can't scrape Authentik's {{ $labels.instance }}
            on port 9300: it has stopped, or isn't on the monitoring-authentik
            network (docs/monitoring.md, "Authentik"). The server down means
            nobody can sign in; the worker down means no email goes out.
            `docker compose ps` and `docker compose logs authentik-{{ $labels.instance }}`
            in PagerArchive's folder.

      # R89b: more failed sign-ins in 5 minutes than mistyping explains, from
      # Authentik's event log, through the API's metrics. It clears once the
      # 5 minutes before hold fewer.
      - uid: pa-failed-sign-ins
        title: Failed sign-ins
        condition: many
        data:
          - refId: failed
            relativeTimeRange: {from: 300, to: 0}
            datasourceUid: prometheus
            model:
              refId: failed
              instant: true
              range: false
              expr: sum(pagerarchive_authentik_events_5m{job="pagerarchive", action="login_failed"})
          - refId: many
            datasourceUid: __expr__
            model:
              refId: many
              type: threshold
              expression: failed
              conditions:
                - evaluator:
                    type: gt
                    # THE THRESHOLD SETTING: failed sign-ins in 5 minutes
                    # before it alerts (R89b: 10). Change it here and restart
                    # Grafana (docs/monitoring.md).
                    params: [10]
        # No count: the API is down ("API unreachable"'s job), or it can't
        # read Authentik's events yet (docs/monitoring.md, "Authentik").
        noDataState: OK
        execErrState: Error
        for: 0s
        labels:
          severity: warning
        annotations:
          summary: "{{ $values.failed.Value }} failed sign-ins in the last 5 minutes"
          description: >-
            More sign-ins failed than people mistyping explains: someone may be
            guessing passwords. The guessing protection locks each account
            after 5 (R44a). The "Authentik" dashboard has them by reason and
            the accounts locked; Authentik's admin interface (Events → Logs)
            has who and from where.

      # R89a, R89b: Authentik's worker tasks are failing, such as sending an
      # email. Each failure is a system_task_exception in Authentik's event
      # log, counted through the API's metrics; the worker's own error counter
      # if that count isn't there. It clears 5 minutes after the last failure.
      - uid: pa-authentik-tasks-failing
        title: Authentik tasks failing
        condition: failing
        data:
          - refId: failures
            relativeTimeRange: {from: 300, to: 0}
            datasourceUid: prometheus
            model:
              refId: failures
              instant: true
              range: false
              expr: >-
                max(pagerarchive_authentik_events_5m{job="pagerarchive", action="system_task_exception"})
                or sum(increase(authentik_tasks_errors_total{job="authentik"}[5m]))
          - refId: failing
            datasourceUid: __expr__
            model:
              refId: failing
              type: threshold
              expression: failures
              conditions:
                - evaluator: {type: gt, params: [0]}
        noDataState: OK
        execErrState: Error
        for: 0s
        labels:
          severity: warning
        annotations:
          summary: "Authentik's worker tasks are failing"
          description: >-
            One or more of Authentik's background tasks failed in the last 5
            minutes, such as sending a sign-in code or an invitation. The
            "Authentik" dashboard says which; Authentik's admin interface
            (System → Tasks, and Events → Logs) says why.
