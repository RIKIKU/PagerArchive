# The dashboards in deploy/monitoring/grafana/dashboards, in a PagerArchive
# folder. Edit them in the files: changes made in Grafana are overwritten.
apiVersion: 1

providers:
  - name: PagerArchive
    folder: PagerArchive
    type: file
    disableDeletion: true
    allowUiUpdates: false
    updateIntervalSeconds: 60
    options:
      path: /var/lib/grafana/dashboards
  # A companion app's dashboards (R76a): deploy/monitoring/include/dashboards.d,
  # which a release never writes in. A subfolder there is a Grafana folder of
  # that name; a dashboard at the top goes in General.
  - name: include
    type: file
    disableDeletion: false
    allowUiUpdates: false
    updateIntervalSeconds: 60
    options:
      path: /var/lib/grafana/dashboards.d
      foldersFromFilesStructure: true
