# The dashboards in deploy/monitoring/grafana/dashboards, in a PagerArchive
# folder. Edit them in the files: changes made in Grafana are overwritten.
apiVersion: 1

providers:
  - name: PagerArchive
    folder: PagerArchive
    type: file
    disableDeletion: true
    allowUiUpdates: false
    updateIntervalSeconds: 60
    options:
      path: /var/lib/grafana/dashboards
