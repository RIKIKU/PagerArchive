name: Upload an artifact, retried
description: >-
  actions/upload-artifact, tried up to 3 times (ADR 0025). GitHub's artifact
  service sometimes fails a request ("Failed to CreateArtifact", with an HTML
  page for an answer); a second try 15 s later, or a third 45 s after that,
  replaces whatever the failed one left (overwrite). An upload that passed
  only on a retry is reported as flaky. Needs the repository checked out.
inputs:
  name:
    description: The artifact's name
    required: true
  path:
    description: What to upload (upload-artifact's path)
    required: true
  if-no-files-found:
    description: warn, error or ignore
    required: false
    default: warn
  retention-days:
    description: Days to keep it
    required: false
    default: "14"
runs:
  using: composite
  steps:
    - id: first
      if: always()
      continue-on-error: true
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
      with:
        name: ${{ inputs.name }}
        path: ${{ inputs.path }}
        if-no-files-found: ${{ inputs.if-no-files-found }}
        retention-days: ${{ inputs.retention-days }}
    - if: always() && steps.first.outcome == 'failure'
      shell: bash
      run: echo "upload-artifact failed on try 1 of 3; trying again in 15 s" && sleep 15
    - id: second
      if: always() && steps.first.outcome == 'failure'
      continue-on-error: true
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
      with:
        name: ${{ inputs.name }}
        path: ${{ inputs.path }}
        if-no-files-found: ${{ inputs.if-no-files-found }}
        retention-days: ${{ inputs.retention-days }}
        overwrite: true
    - if: always() && steps.second.outcome == 'failure'
      shell: bash
      run: echo "upload-artifact failed on try 2 of 3; trying again in 45 s" && sleep 45
    - id: third
      if: always() && steps.second.outcome == 'failure'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
      with:
        name: ${{ inputs.name }}
        path: ${{ inputs.path }}
        if-no-files-found: ${{ inputs.if-no-files-found }}
        retention-days: ${{ inputs.retention-days }}
        overwrite: true
    - if: always() && steps.first.outcome == 'failure' && (steps.second.outcome == 'success' || steps.third.outcome == 'success')
      shell: bash
      env:
        WHAT: upload-artifact ${{ inputs.name }}
        HOW: passed on try ${{ steps.second.outcome == 'success' && '2' || '3' }} of 3
      run: sh scripts/ci/flaky.sh "$WHAT" "$HOW"
