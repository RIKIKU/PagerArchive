name: Maintenance CI failed

# R85c (ADR 0022): when CI fails on an automatic update's pull request, the
# owner is told: scripts/ci/tell-owner.sh assigns it to them. GitHub runs this
# from main's copy of the file only.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: read

jobs:
  tell:
    name: Tell the owner
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.event == 'pull_request' &&
      startsWith(github.event.workflow_run.head_branch, 'renovate/')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Assign the pull request to the owner
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          RUN: ${{ github.event.workflow_run.html_url }}
        run: sh scripts/ci/tell-owner.sh "$BRANCH" "$RUN"
