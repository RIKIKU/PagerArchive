name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Tests, golden tables and acceptance checks
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgis/postgis:18-3.6
        env:
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    env:
      PAGERARCHIVE_TEST_DATABASE_URL: postgres://postgres:test@localhost:5432/postgres?sslmode=disable
      PAGERARCHIVE_REQUIRE_DB: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l . | tee /dev/stderr)"
      - name: go vet
        run: go vet ./...
      - name: sqlc generated code is up to date
        run: go run github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1 diff
      - name: validate-profile (example golden tables)
        run: go run ./cmd/pagerarchive validate-profile -v profiles/example
      - name: Tests (unit, golden, A2, A5, A6 storage, A7, A8, A9, A14, M2 API checks, A24-A29 API level)
        run: go test -count=1 -v ./... 2>&1 | tee test.log; test "${PIPESTATUS[0]}" -eq 0
        shell: bash
      - name: Acceptance check summary
        if: always()
        run: |
          grep -E '^ *--- (PASS|FAIL): Test(A[0-9]+|ExampleGolden|ClientAuth|Dedup|PostGIS)|postgis:|^(ok|FAIL)' test.log || true

  web:
    name: Browser app and browser tests (A1, A3, A4, A10, A22, A29, R31, WCAG)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        working-directory: web
        run: npm ci --no-fund --no-audit
      - name: svelte-check
        working-directory: web
        run: npm run check
      - name: Install browsers
        working-directory: web
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Browser tests against a real API and PostGIS
        run: sh scripts/e2e.sh
      - name: Upload Playwright report, screenshots and traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            web/playwright-report/
            web/test-results/
          if-no-files-found: ignore
          retention-days: 14

  stack:
    name: Accounts against Authentik (A23-A28, A33, section 11 step 2)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        working-directory: web
        run: npm ci --no-fund --no-audit
      - name: Install browser
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: A23-A28 and A33 against the compose stack (API, PostgreSQL, Authentik, Mailpit)
        run: sh scripts/stack-checks.sh
      - name: Section 11 step 2 in a browser, on a fresh stack
        run: sh scripts/stack-e2e.sh --project=chromium
      - name: Upload Playwright report, screenshots and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stack-e2e-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            web/playwright-report/
            web/test-results/
          if-no-files-found: ignore
          retention-days: 14

  images:
    name: Images and client replay (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            server: true
          - arch: arm64
            runner: ubuntu-24.04-arm
            server: false
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - name: Build client image (native ${{ matrix.arch }})
        run: docker build -f Dockerfile.client --build-arg VERSION=${{ github.sha }} -t pagerarchive-client:ci .
      - name: Client --version
        run: docker run --rm pagerarchive-client:ci --version
      - name: Build server image (amd64 only)
        if: matrix.server
        run: docker build --build-arg VERSION=${{ github.sha }} -t pagerarchive:ci .
      - name: Server image runs validate-profile
        if: matrix.server
        run: docker run --rm -v "$PWD/profiles/example:/profiles:ro" pagerarchive:ci validate-profile /profiles
      - name: Client stdin replay into the server image
        if: matrix.server
        run: sh scripts/ci/client-replay.sh pagerarchive:ci pagerarchive-client:ci
      - name: Client stdin replay (arm64 client, amd64 server image built under emulation)
        if: ${{ !matrix.server }}
        run: |
          docker run --privileged --rm tonistiigi/binfmt --install amd64
          docker build --platform linux/amd64 -t pagerarchive:ci .
          sh scripts/ci/client-replay.sh pagerarchive:ci pagerarchive-client:ci
