name: CI

on:
  push:
  pull_request:
  # Publishes the current branch's images tagged sha-<commit> only (owner, 2026-10-13).
  workflow_dispatch:

permissions:
  contents: read

# Every job has a time limit well above its usual time (ADR 0012), so a hang
# fails in minutes rather than after GitHub's 6 hours.
jobs:
  test:
    name: Tests, golden tables and acceptance checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgis/postgis:18-3.6
        env:
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    env:
      PAGERARCHIVE_TEST_DATABASE_URL: postgres://postgres:test@localhost:5432/postgres?sslmode=disable
      PAGERARCHIVE_REQUIRE_DB: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l . | tee /dev/stderr)"
      - name: go vet
        run: go vet ./...
      - name: sqlc generated code is up to date
        run: go run github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1 diff
      - name: validate-profile (example golden tables)
        run: go run ./cmd/pagerarchive validate-profile -v profiles/example
      - name: Tests (unit, golden, A2, A5, A6 storage, A7, A8, A9, A14, M2 API checks, A24-A29 API level, A30-A32, A35-A50, M9 live streams, address guard, preset stand-ins)
        run: go test -count=1 -v ./... 2>&1 | tee test.log; test "${PIPESTATUS[0]}" -eq 0
        shell: bash
      - name: Acceptance check summary
        if: always()
        run: |
          grep -E '^ *--- (PASS|FAIL): Test(A[0-9]+|ExampleGolden|ClientAuth|Dedup|PostGIS|Presets|StandIns|Integration|Deactivation|LockedAccounts|M6|M7|Import|PowerShell|M9)|postgis:|^(ok|FAIL)' test.log || true

  web:
    name: Browser app and browser tests (A1, A3, A4, A10, A22, A29, A30, A34, A40-A50, A60, R31, a role change in an open list, WCAG)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # Microsoft's Playwright image, the exact version in web/package-lock.json
    # (by digest): the browsers and their libraries are already installed.
    # There's no Docker in it, so the database is a service container,
    # started with the settings scripts/e2e.sh gives its own (ADR 0012).
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble@sha256:06a9939e57531807f8d5fd76ce44b53165ffb7d7501d87ab10e285c20b1e971f
      options: --ipc=host
    services:
      postgres:
        image: postgis/postgis:18-3.6
        env:
          POSTGRES_PASSWORD: test
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    env:
      PA_E2E_DATABASE_URL: postgres://postgres:test@postgres:5432/postgres?sslmode=disable
      # Firefox won't start as root with a home folder owned by someone else.
      HOME: /root
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install psql (the tests change the database directly)
        run: apt-get update -qq && apt-get install -y -qq --no-install-recommends postgresql-client >/dev/null
      - name: Install dependencies
        working-directory: web
        run: npm ci --no-fund --no-audit
      - name: svelte-check
        working-directory: web
        run: npm run check
      - name: Playwright is the image's version
        working-directory: web
        run: test "$(npx playwright --version)" = "Version 1.64.0"
      - name: Browser tests against a real API and PostGIS
        run: sh scripts/e2e.sh
      - name: Upload Playwright report, screenshots and traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            web/playwright-report/
            web/test-results/
          if-no-files-found: ignore
          retention-days: 14

  powershell:
    name: PowerShell module (${{ matrix.os }}, PowerShell ${{ matrix.pwsh }})
    # The module's analyzer, meta-tests, behaviour tests and sign-in tests
    # (docs/powershell-guidelines.md, ADR 0009 §11): on the minimum (7.6.0)
    # and the newest stable release, on Windows (the DPAPI file) and Linux
    # (a SecretStore vault, and no vault).
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
        pwsh: ["7.6.0", newest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Install PowerShell ${{ matrix.pwsh }} and the test modules
        shell: pwsh
        run: |
          $pwsh = ./scripts/ci/Install-PowerShell.ps1 -Version '${{ matrix.pwsh }}' -Destination (Join-Path $env:RUNNER_TEMP 'pwsh')
          "PA_PWSH=$pwsh" | Out-File -FilePath $env:GITHUB_ENV -Append
          ./scripts/ci/Save-TestModules.ps1 -Path (Join-Path $env:RUNNER_TEMP 'psmodules')
      - name: PSScriptAnalyzer, meta-tests, behaviour and sign-in tests
        shell: pwsh
        run: |
          $env:PSModulePath = Join-Path $env:RUNNER_TEMP 'psmodules'
          & $env:PA_PWSH -NoProfile -NonInteractive -File ./powershell/tests/Invoke-Tests.ps1 -ResultPath pester-results.xml
          exit $LASTEXITCODE
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pester-${{ matrix.os }}-${{ matrix.pwsh }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: pester-results.xml
          if-no-files-found: ignore
          retention-days: 14

  # The account checks and the module's checks with each vault, as three
  # parallel jobs, each on its own compose stack (scripts/stack-checks.sh,
  # PA_STACK_PART); they used to run one after the other on one stack.
  stack:
    name: Against Authentik (${{ matrix.title }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - part: accounts
            title: A23-A28, A33, A50 join during a preview, the locked-accounts metric
          - part: secretstore
            title: the PowerShell module (A20, A21, A51-A56, A58, A59) with a SecretStore vault
          - part: none
            title: the PowerShell module (A20, A21, A51-A56, A58, A59) with no vault
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      PA_STACK_PART: ${{ matrix.part }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Install PowerShell 7.6.0 (the module's minimum) and the test modules
        if: matrix.part != 'accounts'
        shell: pwsh
        run: |
          $pwsh = ./scripts/ci/Install-PowerShell.ps1 -Version 7.6.0 -Destination (Join-Path $env:RUNNER_TEMP 'pwsh')
          "PA_STACK_PWSH=$pwsh" | Out-File -FilePath $env:GITHUB_ENV -Append
          "PA_STACK_PS_MODULES=$(Join-Path $env:RUNNER_TEMP 'psmodules')" | Out-File -FilePath $env:GITHUB_ENV -Append
          ./scripts/ci/Save-TestModules.ps1 -Path (Join-Path $env:RUNNER_TEMP 'psmodules')
      - name: The checks against the compose stack (API, PostgreSQL, Authentik, Mailpit)
        run: sh scripts/stack-checks.sh

  stack-e2e:
    name: Section 11 steps 2 and 3 in a browser, on the compose stack
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        working-directory: web
        run: npm ci --no-fund --no-audit
      # Not in Playwright's container: this job runs the compose stack, which
      # needs the runner's Docker and its ports. The browser download is
      # cached instead, by Playwright's version; its system libraries are
      # still installed with apt each time.
      - name: Playwright's version
        id: playwright
        working-directory: web
        run: echo "version=$(npx playwright --version | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Install browser
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Section 11 steps 2 and 3 in a browser, on a fresh stack
        run: sh scripts/stack-e2e.sh --project=chromium
      - name: Upload Playwright report, screenshots and traces
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: stack-e2e-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            web/playwright-report/
            web/test-results/
          if-no-files-found: ignore
          retention-days: 14

  images:
    name: Images and client replay (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            server: true
          - arch: arm64
            runner: ubuntu-24.04-arm
            server: false
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Build client image (native ${{ matrix.arch }})
        run: docker build -f Dockerfile.client --build-arg VERSION=${{ github.sha }} -t pagerarchive-client:ci .
      - name: Client --version
        run: docker run --rm pagerarchive-client:ci --version
      - name: Build server image (amd64 only)
        if: matrix.server
        run: docker build --build-arg VERSION=${{ github.sha }} -t pagerarchive:ci .
      - name: Server image runs validate-profile
        if: matrix.server
        run: docker run --rm -v "$PWD/profiles/example:/profiles:ro" pagerarchive:ci validate-profile /profiles
      - name: Client stdin replay into the server image
        if: matrix.server
        run: sh scripts/ci/client-replay.sh pagerarchive:ci pagerarchive-client:ci
      - name: Client stdin replay (arm64 client, amd64 server image built under emulation)
        if: ${{ !matrix.server }}
        run: |
          docker run --privileged --rm tonistiigi/binfmt --install amd64
          docker build --platform linux/amd64 -t pagerarchive:ci .
          sh scripts/ci/client-replay.sh pagerarchive:ci pagerarchive-client:ci

  budget:
    name: Resource budget, short run (A15)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      # Full stack with Authentik, a made-up dataset of real size, 20 viewers,
      # 5 minutes of pages at 20x the 1,500/day rate, then 2 idle minutes.
      # The full 1-hour run is done by hand (docs/adr/0005).
      - name: A15 short run
        run: sh scripts/a15.sh -m 5 -w 1 -i 2 -r 30000 -o a15-results
      - name: Upload memory samples and summary
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: a15-${{ github.run_id }}-${{ github.run_attempt }}
          path: a15-results/
          retention-days: 30

  # Images on GHCR (SPEC.md section 8), only from a green build (owner,
  # 2026-10-13): main -> latest, main, sha-<commit>; a vX.Y.Z tag -> X.Y.Z,
  # X.Y, sha-<commit>; a manual run on any branch -> sha-<commit> only. Other
  # pushes build the images without publishing them.
  publish-server:
    name: Publish server image (amd64)
    needs: [test, web, stack, stack-e2e, images, budget, powershell]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    env:
      PUBLISH: ${{ github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: env.PUBLISH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/rikiku/pagerarchive
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=main,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=short
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          build-args: VERSION=${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          push: ${{ env.PUBLISH == 'true' }}
      - name: Summary
        run: |
          echo "published: $PUBLISH"
          echo "${{ steps.meta.outputs.tags }}"

  publish-client:
    name: Build client image for publishing (${{ matrix.arch }})
    needs: [test, web, stack, stack-e2e, images, budget, powershell]
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    env:
      PUBLISH: ${{ github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: env.PUBLISH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/rikiku/pagerarchive-client
      # Each architecture is built natively and pushed by digest; the next
      # job joins them into one multi-arch tag.
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.client
          platforms: linux/${{ matrix.arch }}
          build-args: VERSION=${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=ghcr.io/rikiku/pagerarchive-client,push-by-digest=true,name-canonical=true,push=${{ env.PUBLISH }}
      - name: Keep the digest
        if: env.PUBLISH == 'true'
        run: |
          mkdir -p digests
          touch "digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
      - uses: actions/upload-artifact@v7
        if: env.PUBLISH == 'true'
        with:
          name: client-digest-${{ matrix.arch }}
          path: digests/*
          retention-days: 1

  publish-client-manifest:
    name: Publish client image (amd64 + arm64)
    needs: [publish-client]
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: digests
          pattern: client-digest-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/rikiku/pagerarchive-client
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=main,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=short
      - name: Join the architectures under the tags
        working-directory: digests
        run: |
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<<"$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf 'ghcr.io/rikiku/pagerarchive-client@sha256:%s ' *)
          docker buildx imagetools inspect ghcr.io/rikiku/pagerarchive-client:${{ steps.meta.outputs.version }}

  # The PowerShell module on the PowerShell Gallery (R63), only from a
  # release (a v* tag) whose checks all passed, with the release's version.
  # Skipped, successfully, while the PSGALLERY_API_KEY secret doesn't exist
  # (the owner creates it).
  publish-powershell:
    name: Publish the PowerShell module to the PowerShell Gallery
    needs: [test, web, stack, stack-e2e, images, budget, powershell]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PSGALLERY_API_KEY: ${{ secrets.PSGALLERY_API_KEY }}
    steps:
      - name: Is the Gallery key set?
        id: key
        run: |
          if [ -z "$PSGALLERY_API_KEY" ]; then
            echo "PowerShell Gallery key not set: skipping publishing"
            echo "set=false" >> "$GITHUB_OUTPUT"
          else
            echo "set=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v5
        if: steps.key.outputs.set == 'true'
      - name: Set the release's version, check and publish
        if: steps.key.outputs.set == 'true'
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          $out = Join-Path $env:RUNNER_TEMP 'PagerArchive'
          Copy-Item -Path powershell/PagerArchive -Destination $out -Recurse
          $manifest = Join-Path $out 'PagerArchive.psd1'
          Update-PSModuleManifest -Path $manifest -ModuleVersion $version
          Test-ModuleManifest -Path $manifest -ErrorAction Stop | Format-List Name, Version, PowerShellVersion, CompatiblePSEditions
          Publish-PSResource -Path $out -Repository PSGallery -ApiKey $env:PSGALLERY_API_KEY

  # The receiving client's binaries for linux/amd64 and linux/arm64 (for a
  # Raspberry Pi without Docker, docs/client.md), with SHA-256 checksums,
  # attached to the release of a v* tag whose checks all passed.
  release-binaries:
    name: Attach client binaries to the release
    needs: [test, web, stack, stack-e2e, images, budget, powershell]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Build
        run: |
          mkdir -p dist
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -trimpath -ldflags "-s -w -X main.version=$GITHUB_REF_NAME" \
              -o "dist/pagerarchive-client-$GITHUB_REF_NAME-linux-$arch" ./cmd/pagerarchive-client
          done
          (cd dist && sha256sum pagerarchive-client-* > SHA256SUMS && cat SHA256SUMS)
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes "PagerArchive $GITHUB_REF_NAME"
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber