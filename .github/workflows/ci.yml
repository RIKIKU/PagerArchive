name: CI

# A push or pull request that changes only documentation (SPEC.md, docs/**,
# other Markdown) runs nothing (owner, 2026-11-01; ADR 0014). Any other file
# changed runs everything. The map sprites' LICENSE.md is built into the
# server (web/web.go embeds web/build), so web/static/** counts as code.
#
# A merge to main isn't a release (SPEC.md 12.1, ADR 0024): once every check
# has passed, its images are published as main and sha-<commit> only. A
# release is cut by the Release workflow (release.yml), which runs this
# workflow (workflow_call) with the release's version: every check, then the
# release jobs below tag the commit v<version> and publish it. Pushes are
# filtered to branches, so a tag push (the release's own, or one made by
# hand) starts no run at all.
#
# Every build writes its version into VERSION and compose.yaml first (the
# stamp job, scripts/ci/stamp-version.sh): a release's own, or for any other
# build <next>-dev+<commit>, such as 1.7.6-dev+3f2c1ab, so a build of main is
# never taken for a release.
#
# Only main runs on push. Every other branch runs on its pull request only
# (owner, 2026-11-12): a push to a branch with an open pull request used to
# start two runs, one for each trigger. A branch with no pull request runs
# nothing until one is opened (or by hand, workflow_dispatch).
#
# A pull request runs only the checks its changed files can affect (ADR
# 0025): the changes job works them out (scripts/ci/changes.sh) and each
# check job has an if on its answer. Anything in .github/workflows/,
# .github/actions/ or scripts/ci/, the shared test fixtures, and any file
# changes.sh doesn't know run everything. A push to main, a manual run and the
# Release workflow's run always run every check, so nothing is released that
# a check was skipped for. "All checks passed" accepts a check skipped only
# when the changes job left it out.
#
# Retries (ADR 0025), none of which hides a failure: what passed only on a
# retry is a warning annotation, "flaky: …", and in the job's summary.
#   1. Network steps try again by themselves, 3 tries: apt, image pulls, GHCR
#      pushes, artifact uploads and downloads, other downloads
#      (scripts/ci/retry.sh, .github/actions/upload, .github/actions/build-push).
#   2. A failed test is run once more in its job: Playwright's retries in CI,
#      Go's tests through gotestsum's --rerun-fails (the test job), Pester's
#      through Invoke-Tests.ps1 -RetryFailed.
#   3. A failed run of a pull request or main has its failed jobs re-run once
#      by the CI retry workflow (ci-retry.yml, scripts/ci/rerun-decision.sh),
#      unless what failed is always the change's.
on:
  push:
    branches: [main]
    paths:
      - "**"
      - "!SPEC.md"
      - "!docs/**"
      - "!**.md"
      - "web/static/**"
  pull_request:
    paths:
      - "**"
      - "!SPEC.md"
      - "!docs/**"
      - "!**.md"
      - "web/static/**"
  # Publishes the current branch's images tagged sha-<commit> only (owner, 2026-10-13).
  workflow_dispatch:
  # The Release workflow's checks and release (ADR 0024).
  workflow_call:
    inputs:
      release:
        description: "The version to release, MAJOR.MINOR.PATCH (release-version.sh's)"
        required: true
        type: string
      dry_run:
        description: "Everything but tagging and publishing"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

# A new push to a pull request's branch cancels that pull request's run still
# in progress (owner, 2026-11-11). Every other run (main's, a manual one, a
# release's) gets a group of its own and is never cancelled or replaced.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.head_ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Every job has a time limit well above its usual time (ADR 0012), so a hang
# fails in minutes rather than after GitHub's 6 hours.
jobs:
  # The build's version (ADR 0024). Every job below that checks out the code
  # writes it into its checkout first (scripts/ci/stamp-version.sh), so what's
  # tested is what's published: the Release workflow's version in its run, or
  # <next>-dev+<commit> in any other (release-version.sh --dev). Also what the
  # run publishes, its mode: release (or dry-run) in the Release workflow's
  # run, main on a push to main, sha on a manual run, none on a pull request.
  stamp:
    name: The build's version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      major_minor: ${{ steps.version.outputs.major_minor }}
      mode: ${{ steps.version.outputs.mode }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - name: Work out the version
        id: version
        env:
          RELEASE: ${{ inputs.release }}
          DRY_RUN: ${{ inputs.dry_run }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: |
          . scripts/ci/versions-lib.sh
          if [ -n "$RELEASE" ]; then
            is_version "$RELEASE" || { echo "::error::The release's version is '$RELEASE', not MAJOR.MINOR.PATCH"; exit 1; }
            version=$RELEASE
            if [ "$DRY_RUN" = true ]; then mode=dry-run; else mode=release; fi
          else
            version=$(sh scripts/ci/release-version.sh --dev HEAD | sed -n 's/^version=//p')
            is_dev_version "$version" || { echo "::error::Couldn't work out this build's version"; exit 1; }
            case $EVENT/$REF in
            push/refs/heads/main) mode=main ;;
            workflow_dispatch/*) mode=sha ;;
            *) mode=none ;;
            esac
          fi
          case $mode in release | main | sha) publish=true ;; *) publish=false ;; esac
          {
            echo "version=$version"
            echo "major_minor=$(major_minor "$version")"
            echo "mode=$mode"
            echo "publish=$publish"
          } | tee -a "$GITHUB_OUTPUT"

  # Which checks run (ADR 0025): on a pull request, those its changed files
  # can affect, from the files between the merge commit's two parents (main,
  # and main with the pull request merged); in any other run, all of them.
  # Each output is a check job's name, true or false. The table is in the
  # job's summary.
  changes:
    name: What the change affects
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      test: ${{ steps.changes.outputs.test }}
      search: ${{ steps.changes.outputs.search }}
      import: ${{ steps.changes.outputs.import }}
      web: ${{ steps.changes.outputs.web }}
      powershell: ${{ steps.changes.outputs.powershell }}
      stack: ${{ steps.changes.outputs.stack }}
      stack-e2e: ${{ steps.changes.outputs.stack-e2e }}
      upgrade: ${{ steps.changes.outputs.upgrade }}
      install: ${{ steps.changes.outputs.install }}
      backups: ${{ steps.changes.outputs.backups }}
      images: ${{ steps.changes.outputs.images }}
      budget: ${{ steps.changes.outputs.budget }}
      monitoring: ${{ steps.changes.outputs.monitoring }}
      govulncheck: ${{ steps.changes.outputs.govulncheck }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 2
      - name: The checks the changed files affect
        id: changes
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" != pull_request ]; then
            sh scripts/ci/changes.sh --all "a $EVENT run checks everything"
          elif git rev-parse -q --verify HEAD^2 >/dev/null; then
            sh scripts/ci/changes.sh HEAD^1 HEAD
          else
            sh scripts/ci/changes.sh --all "HEAD isn't the pull request's merge commit, so what changed isn't known"
          fi

  # The repository's own VERSION and compose.yaml are unstamped, and the
  # module's ModuleVersion is raised if the module changed since the previous
  # release (SPEC.md 12.1, R63; ADR 0024).
  versions:
    name: Versions are left to the release, and the module's is raised
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - name: Unstamped, and the module's version against the previous release
        run: sh scripts/ci/check-versions.sh HEAD
      # ADR 0024: what's released, as which version, and the stamp.
      - name: The release's version (release-version.sh, stamp-version.sh, check-versions.sh)
        run: sh scripts/ci/release-version-checks.sh
      - name: A failed automatic update is assigned to the owner (tell-owner.sh)
        run: sh scripts/ci/tell-owner-checks.sh
      # ADR 0025: what a pull request runs, and the retries.
      - name: The checks each change runs (changes.sh)
        run: sh scripts/ci/changes-checks.sh
      - name: Retries, re-runs and govulncheck's verdict (retry.sh, rerun-decision.sh, govulncheck.sh)
        run: sh scripts/ci/retry-checks.sh

  test:
    name: Tests, golden tables and acceptance checks
    needs: [stamp, changes]
    if: needs.changes.outputs.test == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgis/postgis:18-3.7
        env:
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    env:
      PAGERARCHIVE_TEST_DATABASE_URL: postgres://postgres:test@localhost:5432/postgres?sslmode=disable
      PAGERARCHIVE_REQUIRE_DB: "1"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Stamp the build's version
        env:
          PA_VERSION: ${{ needs.stamp.outputs.version }}
        run: sh scripts/ci/stamp-version.sh "$PA_VERSION"
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l . | tee /dev/stderr)"
      - name: go vet
        run: go vet ./...
      - name: sqlc generated code is up to date
        run: go run github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1 diff
      - name: validate-profile (example golden tables)
        run: go run ./cmd/pagerarchive validate-profile -v profiles/example
      - name: Tests (unit, golden, A2, A5, A6 storage, A7, A8, A9, A14, M2 API checks, A24-A29 API level, A30-A32, A35-A50, M9 live streams, address guard, preset stand-ins, A62-A64, A66, radio health, delivery failure causes)
        # Layer 2 of the retries (ADR 0025): gotestsum runs go test, then once
        # more only the tests that failed (5 at most: more means something
        # broke, and nothing is run again). A test that passes only then is
        # flaky, reported below; one that fails again fails the step.
        # (GitHub runs bash with -e and pipefail: the status is kept, so the
        # flaky ones are reported when another test failed too.)
        run: |
          status=0
          go run gotest.tools/gotestsum@v1.13.0 --format standard-verbose --packages ./... \
            --rerun-fails=1 --rerun-fails-max-failures=5 --rerun-fails-report rerun.txt -- -count=1 2>&1 | tee test.log || status=$?
          # One line per test run again: "<package>.<test>: <runs> runs, <failures> failures".
          if [ -s rerun.txt ]; then
            while IFS= read -r line; do
              runs=$(echo "$line" | sed -n 's/.*: \([0-9]*\) runs, \([0-9]*\) failures*$/\1/p')
              failures=$(echo "$line" | sed -n 's/.*: \([0-9]*\) runs, \([0-9]*\) failures*$/\2/p')
              if [ -n "$runs" ] && [ "$failures" -lt "$runs" ]; then
                sh scripts/ci/flaky.sh "go test ${line%%:*}" "failed, then passed when run again"
              fi
            done <rerun.txt
          fi
          exit "$status"
        shell: bash
      - name: Acceptance check summary
        if: always()
        run: |
          grep -E '^ *--- (PASS|FAIL): Test(A[0-9]+|ExampleGolden|ClientAuth|Dedup|PostGIS|Presets|StandIns|Integration|Deactivation|LockedAccounts|M6|M7|Import|PowerShell|M9|M12|FailureCauses|Radio|NoSquelch)|postgis:|^(ok|FAIL)' test.log || true

  # A75: R33b's searches on 10 years of made-up pages (ADR 0017), each within
  # 1 second and listing the same pages as the query before M13a, including
  # the first run after a restart with both caches cold. Its own job, as
  # seeding 4,562,500 pages takes minutes.
  search:
    name: Search speed (A75)
    needs: [stamp, changes]
    if: needs.changes.outputs.search == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    services:
      postgres:
        image: postgis/postgis:18-3.7
        env:
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    env:
      PAGERARCHIVE_TEST_DATABASE_URL: postgres://postgres:test@localhost:5432/postgres?sslmode=disable
      PAGERARCHIVE_REQUIRE_DB: "1"
      PAGERARCHIVE_A75: "1"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Stamp the build's version
        env:
          PA_VERSION: ${{ needs.stamp.outputs.version }}
        run: sh scripts/ci/stamp-version.sh "$PA_VERSION"
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - name: Disk before
        run: df -h /
      - name: A75 on 4,562,500 made-up pages
        env:
          PAGERARCHIVE_A75_CONTAINER: ${{ job.services.postgres.id }}
        run: go test -count=1 -v -timeout 35m -run TestA75SearchSpeed ./internal/acceptance/
      - name: Disk after
        if: always()
        run: df -h /

  import:
    name: Importing messages (A76)
    needs: [stamp, changes]
    if: needs.changes.outputs.import == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Stamp the build's version
        env:
          PA_VERSION: ${{ needs.stamp.outputs.version }}
        run: sh scripts/ci/stamp-version.sh "$PA_VERSION"
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - name: Pull the images (retried)
        run: sh scripts/ci/pull-images.sh Dockerfile compose.yaml deploy/test/compose.yaml
      - name: A76's file checks, through the command on the compose stack
        run: sh scripts/a76-checks.sh
      - name: Disk before
        run: df -h /
      - name: A76's speed, 200,000 pages in random order on top of 4,562,500 with live pages, then A75's searches
        run: sh scripts/a76.sh -r -o a76-results
      - name: Disk after
        if: always()
        run: df -h /
      - name: Upload the rate, memory samples and logs
        if: always()
        uses: ./.github/actions/upload
        with:
          name: a76-${{ github.run_id }}-${{ github.run_attempt }}
          path: a76-results/
          if-no-files-found: ignore
          retention-days: 14

  web:
    name: Browser app and browser tests (A1, A3, A4, A10, A22, A29, A30, A34, A40-A50, A60, R31, a role change in an open list, WCAG)
    needs: [stamp, changes]
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # Microsoft's Playwright image, the exact version in web/package-lock.json
    # (by digest): the browsers and their libraries are already installed.
    # There's no Docker in it, so the database is a service container,
    # started with the settings scripts/e2e.sh gives its own (ADR 0012).
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble@sha256:06a9939e57531807f8d5fd76ce44b53165ffb7d7501d87ab10e285c20b1e971f
      options: --ipc=host
    services:
      postgres:
        image: postgis/postgis:18-3.7
        env:
          POSTGRES_PASSWORD: test
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    env:
      PA_E2E_DATABASE_URL: postgres://postgres:test@postgres:5432/postgres?sslmode=disable
      # Firefox won't start as root with a home folder owned by someone else.
      HOME: /root
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Stamp the build's version
        env:
          PA_VERSION: ${{ needs.stamp.outputs.version }}
        run: sh scripts/ci/stamp-version.sh "$PA_VERSION"
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      # The container runs as root and the checkout is the runner's: git (and
      # so go build's version stamp) refuses a folder someone else owns.
      - name: Let git read the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Install psql (the tests change the database directly)
        run: sh scripts/ci/retry.sh -l "apt-get install postgresql-client" sh -c 'apt-get update -qq && apt-get install -y -qq --no-install-recommends postgresql-client >/dev/null'
      - name: Install dependencies
        working-directory: web
        run: npm ci --no-fund --no-audit
      - name: svelte-check
        working-directory: web
        run: npm run check
      # R82c, A73: components style with the tokens in src/app.css only; a
      # hard-coded colour, size, spacing, radius or type fails, naming the
      # file, line and value.
      - name: Style tokens only (A73)
        working-directory: web
        run: node scripts/check-tokens.mjs
      # R77a: the icons are generated from the pinned Tabler Icons package.
      - name: Icons are as generated from @tabler/icons
        working-directory: web
        run: node scripts/icons.mjs --check
      - name: Playwright is the image's version
        working-directory: web
        run: test "$(npx playwright --version)" = "Version 1.64.0"
      # A test that passed only on its retry (flaky) keeps its report too, with
      # the failed try's trace.
      - name: Browser tests against a real API and PostGIS
        id: e2e
        run: sh scripts/e2e.sh
      - name: Upload Playwright report, screenshots and traces
        if: failure() || steps.e2e.outputs.flaky == 'true'
        uses: ./.github/actions/upload
        with:
          name: playwright-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            web/playwright-report/
            web/test-results/
          if-no-files-found: ignore
          retention-days: 14

  powershell:
    name: PowerShell module (${{ matrix.os }}, PowerShell ${{ matrix.pwsh }})
    # The module's analyzer, meta-tests, behaviour tests and sign-in tests
    # (docs/powershell-guidelines.md, ADR 0009 §11): on the minimum (7.6.0)
    # and the newest stable release, on Windows (the DPAPI file) and Linux
    # (a SecretStore vault, and no vault).
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
        pwsh: ["7.6.0", newest]
    needs: changes
    if: needs.changes.outputs.powershell == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      # PowerShell's own telemetry goes through the default proxy, and once
      # reached the stand-in proxy of Watch.Tests.ps1 before the test's request
      # did (ADR 0019). It's read when pwsh starts, so it's set here, not in the test.
      POWERSHELL_TELEMETRY_OPTOUT: "1"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install PowerShell ${{ matrix.pwsh }} and the test modules
        shell: pwsh
        run: |
          $pwsh = ./scripts/ci/Install-PowerShell.ps1 -Version '${{ matrix.pwsh }}' -Destination (Join-Path $env:RUNNER_TEMP 'pwsh')
          "PA_PWSH=$pwsh" | Out-File -FilePath $env:GITHUB_ENV -Append
          ./scripts/ci/Save-TestModules.ps1 -Path (Join-Path $env:RUNNER_TEMP 'psmodules')
      # Layer 2 of the retries (ADR 0025): up to 5 failed tests run once more,
      # and any that pass then are reported as flaky.
      - name: PSScriptAnalyzer, meta-tests, behaviour and sign-in tests
        shell: pwsh
        run: |
          $env:PSModulePath = Join-Path $env:RUNNER_TEMP 'psmodules'
          # A watch that won't stop is dumped here, with its stack (ADR 0012).
          $env:PA_TEST_DUMP_DIR = Join-Path $env:RUNNER_TEMP 'dumps'
          & $env:PA_PWSH -NoProfile -NonInteractive -File ./powershell/tests/Invoke-Tests.ps1 -ResultPath pester-results.xml -RetryFailed
          exit $LASTEXITCODE
      - name: Upload a dump of a stuck test
        if: failure()
        uses: ./.github/actions/upload
        with:
          name: pester-dump-${{ matrix.os }}-${{ matrix.pwsh }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/dumps/
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload test results
        if: always()
        uses: ./.github/actions/upload
        with:
          name: pester-${{ matrix.os }}-${{ matrix.pwsh }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: pester-results.xml
          if-no-files-found: ignore
          retention-days: 14

  # The account checks and the module's checks with each vault, as three
  # parallel jobs, each on its own compose stack (scripts/stack-checks.sh,
  # PA_STACK_PART); they used to run one after the other on one stack.
  stack:
    name: Against Authentik (${{ matrix.title }})
    needs: [stamp, changes]
    if: needs.changes.outputs.stack == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - part: accounts
            title: A23-A28, A33, A50 join during a preview, the locked-accounts metric
          - part: secretstore
            title: the PowerShell module (A20, A21, A51-A56, A58, A59) with a SecretStore vault
          - part: none
            title: the PowerShell module (A20, A21, A51-A56, A58, A59) with no vault
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      PA_STACK_PART: ${{ matrix.part }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Stamp the build's version
        env:
          PA_VERSION: ${{ needs.stamp.outputs.version }}
        run: sh scripts/ci/stamp-version.sh "$PA_VERSION"
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - name: Install PowerShell 7.6.0 (the module's minimum) and the test modules
        if: matrix.part != 'accounts'
        shell: pwsh
        run: |
          $pwsh = ./scripts/ci/Install-PowerShell.ps1 -Version 7.6.0 -Destination (Join-Path $env:RUNNER_TEMP 'pwsh')
          "PA_STACK_PWSH=$pwsh" | Out-File -FilePath $env:GITHUB_ENV -Append
          "PA_STACK_PS_MODULES=$(Join-Path $env:RUNNER_TEMP 'psmodules')" | Out-File -FilePath $env:GITHUB_ENV -Append
          ./scripts/ci/Save-TestModules.ps1 -Path (Join-Path $env:RUNNER_TEMP 'psmodules')
      - name: Pull the images (retried)
        run: sh scripts/ci/pull-images.sh Dockerfile compose.yaml deploy/test/compose.yaml
      - name: The checks against the compose stack (API, PostgreSQL, Authentik, Mailpit)
        run: sh scripts/stack-checks.sh

  stack-e2e:
    name: Section 11 steps 2 and 3 in a browser, on the compose stack
    needs: [stamp, changes]
    if: needs.changes.outputs.stack-e2e == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Stamp the build's version
        env:
          PA_VERSION: ${{ needs.stamp.outputs.version }}
        run: sh scripts/ci/stamp-version.sh "$PA_VERSION"
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        working-directory: web
        run: npm ci --no-fund --no-audit
      # Not in Playwright's container: this job runs the compose stack, which
      # needs the runner's Docker and its ports. The browser download is
      # cached instead, by Playwright's version; its system libraries are
      # still installed with apt each time.
      - name: Playwright's version
        id: playwright
        working-directory: web
        run: echo "version=$(npx playwright --version | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Install browser
        working-directory: web
        run: sh ../scripts/ci/retry.sh -l "playwright install --with-deps chromium" npx playwright install --with-deps chromium
      - name: Pull the images (retried)
        run: sh scripts/ci/pull-images.sh Dockerfile Dockerfile.client compose.yaml deploy/test/compose.yaml
      - name: Section 11 steps 2 and 3 in a browser, on a fresh stack
        run: sh scripts/stack-e2e.sh --project=chromium
      - name: Upload Playwright report, screenshots and traces
        if: always()
        uses: ./.github/actions/upload
        with:
          name: stack-e2e-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            web/playwright-report/
            web/test-results/
          if-no-files-found: ignore
          retention-days: 14

  # A77: from the latest release's attached files (the one GitHub marks Latest)
  # to this build's with `docker compose pull && docker compose up -d` only, on
  # every pull request and every build of main, so a change that breaks the
  # upgrade is caught before a release is cut (ADR 0024). Needs the v* tags.
  upgrade:
    name: Upgrade from the latest release (A77)
    needs: [stamp, changes]
    if: needs.changes.outputs.upgrade == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - name: Stamp the build's version
        env:
          PA_VERSION: ${{ needs.stamp.outputs.version }}
        run: sh scripts/ci/stamp-version.sh "$PA_VERSION"
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - name: Get the release tags
        run: sh scripts/ci/retry.sh git fetch --force --tags origin
      - name: Pull the images (retried)
        run: sh scripts/ci/pull-images.sh Dockerfile compose.yaml deploy/test/compose.yaml scripts/install-lib.sh
      - name: A77
        run: sh scripts/a77.sh -o a77-results
      - name: Upload the upgrade's output and logs
        if: always()
        uses: ./.github/actions/upload
        with:
          name: a77-${{ github.run_id }}-${{ github.run_attempt }}
          path: a77-results/
          if-no-files-found: ignore
          retention-days: 14

  # A78: an empty folder, the release's files, `docker compose up -d`, then
  # section 11's steps in a browser, and again behind a proxy on an external
  # network.
  install:
    name: Install with no checkout (A78)
    needs: [stamp, changes]
    if: needs.changes.outputs.install == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Stamp the build's version
        env:
          PA_VERSION: ${{ needs.stamp.outputs.version }}
        run: sh scripts/ci/stamp-version.sh "$PA_VERSION"
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        working-directory: web
        run: npm ci --no-fund --no-audit
      - name: Playwright's version
        id: playwright
        working-directory: web
        run: echo "version=$(npx playwright --version | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Install browser
        working-directory: web
        run: sh ../scripts/ci/retry.sh -l "playwright install --with-deps chromium" npx playwright install --with-deps chromium
      - name: Pull the images (retried)
        run: sh scripts/ci/pull-images.sh Dockerfile Dockerfile.client compose.yaml deploy/test/compose.yaml scripts/install-lib.sh
      - name: A78
        run: sh scripts/a78.sh --project=chromium
      - name: Upload Playwright report, screenshots and traces
        if: failure()
        uses: ./.github/actions/upload
        with:
          name: a78-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            web/playwright-report/
            web/test-results/
          if-no-files-found: ignore
          retention-days: 14

  # A80: nightly backups in a folder made from the release's files: the schedule,
  # the check, the clock, a failure seen in a browser, and a restore into a new
  # install. Its alert is in the monitoring job.
  backups:
    name: Backups (A80)
    needs: [stamp, changes]
    if: needs.changes.outputs.backups == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Stamp the build's version
        env:
          PA_VERSION: ${{ needs.stamp.outputs.version }}
        run: sh scripts/ci/stamp-version.sh "$PA_VERSION"
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        working-directory: web
        run: npm ci --no-fund --no-audit
      - name: Playwright's version
        id: playwright
        working-directory: web
        run: echo "version=$(npx playwright --version | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Install browser
        working-directory: web
        run: sh ../scripts/ci/retry.sh -l "playwright install --with-deps chromium" npx playwright install --with-deps chromium
      - name: Pull the images (retried)
        run: sh scripts/ci/pull-images.sh Dockerfile compose.yaml deploy/test/compose.yaml scripts/install-lib.sh
      - name: A80
        run: sh scripts/a80.sh -o a80-results --project=chromium
      - name: Upload the logs, Playwright report and screenshots
        if: always()
        uses: ./.github/actions/upload
        with:
          name: a80-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            a80-results/
            web/playwright-report/
            web/test-results/
          if-no-files-found: ignore
          retention-days: 14

  images:
    name: Images and client replay (${{ matrix.arch }})
    needs: [stamp, changes]
    if: needs.changes.outputs.images == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            server: true
          - arch: arm64
            runner: ubuntu-24.04-arm
            server: false
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Stamp the build's version
        env:
          PA_VERSION: ${{ needs.stamp.outputs.version }}
        run: sh scripts/ci/stamp-version.sh "$PA_VERSION"
      - name: Pull the images (retried)
        run: sh scripts/ci/pull-images.sh Dockerfile Dockerfile.client
      - name: Build client image (native ${{ matrix.arch }})
        run: docker build -f Dockerfile.client -t pagerarchive-client:ci .
      - name: Client --version is the build's version
        env:
          PA_VERSION: ${{ needs.stamp.outputs.version }}
        run: |
          docker run --rm pagerarchive-client:ci --version | tee client-version.txt
          test "$(cat client-version.txt)" = "pagerarchive-client $PA_VERSION"
      - name: Build server image (amd64 only)
        if: matrix.server
        run: docker build -t pagerarchive:ci .
      - name: Server version is the build's version
        if: matrix.server
        env:
          PA_VERSION: ${{ needs.stamp.outputs.version }}
        run: |
          docker run --rm pagerarchive:ci version | tee server-version.txt
          test "$(cat server-version.txt)" = "pagerarchive $PA_VERSION"
      - name: Server image runs validate-profile
        if: matrix.server
        run: docker run --rm -v "$PWD/profiles/example:/profiles:ro" pagerarchive:ci validate-profile /profiles
      - name: Client stdin replay into the server image
        if: matrix.server
        run: sh scripts/ci/client-replay.sh pagerarchive:ci pagerarchive-client:ci
      - name: Client stdin replay (arm64 client, amd64 server image built under emulation)
        if: ${{ !matrix.server }}
        run: |
          sh scripts/ci/retry.sh docker pull -q tonistiigi/binfmt
          docker run --privileged --rm tonistiigi/binfmt --install amd64
          docker build --platform linux/amd64 -t pagerarchive:ci .
          sh scripts/ci/client-replay.sh pagerarchive:ci pagerarchive-client:ci

  budget:
    name: Resource budget, short run (A15), telemetry ${{ matrix.telemetry }}
    needs: [stamp, changes]
    if: needs.changes.outputs.budget == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - telemetry: "off"
            flag: ""
          # R69: with telemetry on, exporting to a test collector, the API
          # stays within the budget too.
          - telemetry: "on"
            flag: "-t"
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Stamp the build's version
        env:
          PA_VERSION: ${{ needs.stamp.outputs.version }}
        run: sh scripts/ci/stamp-version.sh "$PA_VERSION"
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      # Full stack with Authentik, a made-up dataset of real size, 20 viewers,
      # 5 minutes of pages at 20x the 1,500/day rate, then 2 idle minutes.
      # The full 1-hour run is done by hand (docs/adr/0005).
      - name: Pull the images (retried)
        run: sh scripts/ci/pull-images.sh Dockerfile compose.yaml deploy/test/compose.yaml
      - name: A15 short run
        run: sh scripts/a15.sh -m 5 -w 1 -i 2 -r 30000 -o a15-results ${{ matrix.flag }}
      - name: Upload memory samples and summary
        if: always()
        uses: ./.github/actions/upload
        with:
          name: a15-telemetry-${{ matrix.telemetry }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: a15-results/
          retention-days: 30

  # A78's install with no checkout, then A65 and A67, against the example
  # monitoring stack itself (deploy/monitoring, R76):
  # Alloy, Tempo, Loki, Prometheus and Grafana scraping a real API, with a
  # webhook contact point the test receives, and (A67) clients in the client
  # image with a stand-in for rtl_fm. The stack's memory is sampled.
  monitoring:
    name: Example monitoring stack (A78's install, A65, A67, A80's alert)
    needs: [stamp, changes]
    if: needs.changes.outputs.monitoring == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Stamp the build's version
        env:
          PA_VERSION: ${{ needs.stamp.outputs.version }}
        run: sh scripts/ci/stamp-version.sh "$PA_VERSION"
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      # Loki refuses every write above 90% disk use, and the runner's disk
      # was at 90.55% once (ADR 0014): remove toolchains this job never uses.
      - name: Free disk space for Loki
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Pull the images (retried)
        run: sh scripts/ci/pull-images.sh Dockerfile Dockerfile.client compose.yaml deploy/test/compose.yaml deploy/monitoring/compose.yaml scripts/install-lib.sh
      - name: The install with no checkout, A65, A67 and A80's alert on the example monitoring stack
        run: sh scripts/monitoring-checks.sh -o monitoring-results
      - name: Upload memory samples and the stack's logs
        if: always()
        uses: ./.github/actions/upload
        with:
          name: monitoring-${{ github.run_id }}-${{ github.run_attempt }}
          path: monitoring-results/
          if-no-files-found: ignore
          retention-days: 14

  # Known vulnerabilities in the Go code and its modules, as govulncheck finds
  # them (ADR 0025): only what the code can reach, unlike OSV's alerts, which
  # name a module whether or not its vulnerable code is called. Every finding
  # is listed in the job's summary; the job fails only for a vulnerability the
  # code calls that has a fixed version (scripts/ci/govulncheck.sh).
  govulncheck:
    name: Known vulnerabilities the code calls (govulncheck)
    needs: [stamp, changes]
    if: needs.changes.outputs.govulncheck == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Stamp the build's version
        env:
          PA_VERSION: ${{ needs.stamp.outputs.version }}
        run: sh scripts/ci/stamp-version.sh "$PA_VERSION"
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - name: govulncheck v1.9.0, failing only for a vulnerability the code calls that has a fix
        run: sh scripts/ci/govulncheck.sh

  # The one check main's ruleset requires before a pull request merges (R85c,
  # ADR 0022), so an automatic update merges only once every check has passed.
  # A check passes if it succeeded, or if it was skipped because the changes
  # job left it out (ADR 0025): a skip the changes job didn't ask for (one
  # whose needed job failed), a failure or a cancel fails it. In a re-run
  # (attempt 2 or later), a job that failed in the attempt before and passed
  # now is reported as flaky.
  checks:
    name: All checks passed
    needs: [stamp, changes, versions, test, search, import, web, powershell, stack, stack-e2e, upgrade, install, backups, images, budget, monitoring, govulncheck]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - name: Every check passed, or was left out as nothing it uses changed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          verdict=$(echo "$NEEDS" | jq -r '
            (.changes.outputs // {}) as $runs
            | to_entries[]
            | if .value.result == "success" then "passed \(.key)"
              elif .value.result == "skipped" and ($runs[.key] // "") == "false" then "left out \(.key)"
              else "FAILED \(.key): \(.value.result)" end')
          echo "$verdict"
          left_out=$(echo "$verdict" | sed -n 's/^left out //p' | tr '\n' ' ')
          [ -z "$left_out" ] || echo "::notice title=Checks left out::Nothing these use changed (ADR 0025): $left_out"
          failed=$(echo "$verdict" | sed -n 's/^FAILED //p')
          if [ -n "$failed" ]; then
            echo "::error::Not every check passed: $(printf '%s' "$failed" | tr '\n' ' ')"
            exit 1
          fi
          echo "Every check passed"
      - name: Jobs that passed only on this re-run
        if: always() && github.run_attempt != '1'
        env:
          GH_TOKEN: ${{ github.token }}
          ATTEMPT: ${{ github.run_attempt }}
        run: |
          before=$((ATTEMPT - 1))
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$before/jobs" \
            --jq '.jobs[] | select(.conclusion == "failure" or .conclusion == "timed_out" or .conclusion == "cancelled") | .name' | sort -u >failed-before.txt
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$ATTEMPT/jobs" \
            --jq '.jobs[] | select(.conclusion == "success") | .name' | sort -u >passed-now.txt
          comm -12 failed-before.txt passed-now.txt | grep -vx 'All checks passed' >flaky.txt || true
          if [ -s flaky.txt ]; then
            printf '\n### Passed only on a retry\n\nEach is a flake to look into: it failed in attempt %s and passed in this one (ADR 0025).\n\n' "$before" >>"$GITHUB_STEP_SUMMARY"
            while IFS= read -r job; do
              echo "::warning title=Flaky::flaky: job $job (failed in attempt $before, passed in attempt $ATTEMPT)"
              echo "- flaky: job $job (failed in attempt $before, passed in attempt $ATTEMPT)" >>"$GITHUB_STEP_SUMMARY"
            done <flaky.txt
          else
            echo "No job that failed in attempt $before passed only now."
          fi

  # The release (SPEC.md 12.1; ADR 0016, ADR 0024): only in the Release
  # workflow's run, once every check passed, before anything is published.
  # The plan fails if the version (the stamp job's, from release-version.sh)
  # isn't higher than the previous release (the newest v* tag in the commit's
  # history), or if its tag is already on another commit, so nothing is
  # published. Otherwise this job tags the commit (annotated, "PagerArchive
  # v<version>"), creates the GitHub release with the client's binaries and
  # checksums, not yet marked the latest (attach-release-files does that), and
  # passes on whether the module is published. A tag pushed with GITHUB_TOKEN
  # starts no run, and the push trigger takes branches only anyway. Re-run, the
  # job finds its own tag and release on this commit and finishes them. In a
  # dry run it tags nothing and creates no release: it shows the notes it would
  # write instead.
  release:
    name: Release v<version> (tag, GitHub release, client binaries)
    # Every check, and none skipped: in the Release workflow's run the changes
    # job runs them all, and a skipped need would skip this job too.
    needs: [stamp, changes, versions, test, search, import, web, stack, stack-e2e, upgrade, install, backups, images, budget, monitoring, powershell, govulncheck]
    if: needs.stamp.outputs.mode == 'release' || needs.stamp.outputs.mode == 'dry-run'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      DRY_RUN: ${{ needs.stamp.outputs.mode == 'dry-run' }}
    outputs:
      version: ${{ steps.plan.outputs.version }}
      major_minor: ${{ steps.plan.outputs.major_minor }}
      tag: ${{ steps.plan.outputs.tag }}
      module: ${{ steps.plan.outputs.module }}
      module_version: ${{ steps.plan.outputs.module_version }}
      dry_run: ${{ needs.stamp.outputs.mode == 'dry-run' }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - name: Stamp the build's version
        env:
          PA_VERSION: ${{ needs.stamp.outputs.version }}
        run: sh scripts/ci/stamp-version.sh "$PA_VERSION"
      - name: Decide what to publish
        id: plan
        env:
          PA_VERSION: ${{ needs.stamp.outputs.version }}
        run: |
          sh scripts/ci/retry.sh git fetch --force --tags origin
          sh scripts/ci/release-plan.sh "$GITHUB_SHA" "$PA_VERSION"
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      # For a Raspberry Pi without Docker (docs/client.md).
      - name: Build the client's binaries
        env:
          TAG: ${{ steps.plan.outputs.tag }}
        run: |
          mkdir -p dist
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -trimpath -ldflags "-s -w" \
              -o "dist/pagerarchive-client-$TAG-linux-$arch" ./cmd/pagerarchive-client
          done
          (cd dist && sha256sum pagerarchive-client-* > SHA256SUMS && cat SHA256SUMS)
      - name: The release's notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.plan.outputs.tag }}
          VERSION: ${{ steps.plan.outputs.version }}
          PREVIOUS: ${{ steps.plan.outputs.previous }}
          MODULE_NOTES: ${{ steps.plan.outputs.notes }}
        run: |
          {
            echo "PagerArchive $TAG, from $GITHUB_SHA."
            echo
            echo "- Images: \`ghcr.io/rikiku/pagerarchive:$VERSION\` and \`ghcr.io/rikiku/pagerarchive-client:$VERSION\` (amd64 and arm64)."
            echo "- To install or upgrade: \`compose.yaml\`, \`env.example\` and \`pagerarchive-config.tar.gz\` (docs/deploy.md). The example monitoring stack: \`monitoring-compose.yaml\` and \`monitoring-env.example\` (docs/monitoring.md)."
            echo "- The client's binaries for linux/amd64 and linux/arm64, with \`SHA256SUMS\` (docs/client.md)."
            echo "- $MODULE_NOTES"
          } > notes.md
          cat notes.md
          if [ "$DRY_RUN" = true ]; then
            echo "--- dry run: GitHub's generated notes, which would follow (nothing is created):"
            gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" -f tag_name="$TAG" -f target_commitish="$GITHUB_SHA" \
              -f previous_tag_name="$PREVIOUS" --jq .body
          fi
      - name: Tag the commit
        if: env.DRY_RUN != 'true'
        env:
          TAG: ${{ steps.plan.outputs.tag }}
        run: |
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "$TAG is already on this commit (a re-run)"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" -m "PagerArchive $TAG" "$GITHUB_SHA"
            # Pushing the same tag again, after a try that got through, is a no-op.
            sh scripts/ci/retry.sh git push origin "refs/tags/$TAG"
          fi
      - name: Create the GitHub release with the binaries
        if: env.DRY_RUN != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.plan.outputs.tag }}
          PREVIOUS: ${{ steps.plan.outputs.previous }}
        # Each try finds a release an earlier one created, so none is made twice.
        run: |
          sh scripts/ci/retry.sh -l "gh release create $TAG" sh -c 'gh release view "$TAG" >/dev/null 2>&1 ||
            gh release create "$TAG" --verify-tag --latest=false --title "PagerArchive $TAG" --notes-file notes.md --generate-notes --notes-start-tag "$PREVIOUS"'
          sh scripts/ci/retry.sh gh release upload "$TAG" dist/* --clobber
      - name: Dry run, so nothing tagged or released
        if: env.DRY_RUN == 'true'
        env:
          TAG: ${{ steps.plan.outputs.tag }}
        run: |
          echo "dry run: would tag $GITHUB_SHA $TAG, create the release \"PagerArchive $TAG\" (not yet the latest) and attach:"
          ls -l dist

  # Images on GHCR (SPEC.md section 8), only from a green build (owner,
  # 2026-10-13), as the stamp job's mode says (ADR 0024): a release ->
  # <version>, its MAJOR.MINOR and latest; a push to main -> main and
  # sha-<commit>; a manual run on any branch -> sha-<commit> only. A pull
  # request, and a release's dry run, build the images without publishing
  # them. Off a release the release job is skipped, so these run unless
  # something they need failed.
  publish-server:
    name: Publish server image (amd64)
    needs: [stamp, changes, test, search, import, web, stack, stack-e2e, upgrade, install, backups, images, budget, monitoring, powershell, govulncheck, versions, release]
    if: ${{ !failure() && !cancelled() && needs.changes.outputs.images == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    env:
      PUBLISH: ${{ needs.stamp.outputs.publish }}
      RELEASE: ${{ needs.stamp.outputs.mode == 'release' || needs.stamp.outputs.mode == 'dry-run' }}
      MAIN: ${{ needs.stamp.outputs.mode == 'main' }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Stamp the build's version
        env:
          PA_VERSION: ${{ needs.stamp.outputs.version }}
        run: sh scripts/ci/stamp-version.sh "$PA_VERSION"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        if: env.PUBLISH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/rikiku/pagerarchive
          tags: |
            type=raw,value=${{ needs.stamp.outputs.version }},enable=${{ env.RELEASE }}
            type=raw,value=${{ needs.stamp.outputs.major_minor }},enable=${{ env.RELEASE }}
            type=raw,value=latest,enable=${{ env.RELEASE }}
            type=raw,value=main,enable=${{ env.MAIN }}
            type=sha,prefix=sha-,format=short,enable=${{ env.RELEASE != 'true' }}
      # Retried when it publishes (ADR 0025).
      - uses: ./.github/actions/build-push
        with:
          context: .
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          push: ${{ env.PUBLISH == 'true' }}
          retry: ${{ env.PUBLISH == 'true' }}
      - name: Summary
        env:
          MODE: ${{ needs.stamp.outputs.mode }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          echo "mode: $MODE; published: $PUBLISH"
          echo "$TAGS"

  publish-client:
    name: Build client image for publishing (${{ matrix.arch }})
    needs: [stamp, changes, test, search, import, web, stack, stack-e2e, upgrade, install, backups, images, budget, monitoring, powershell, govulncheck, versions, release]
    if: ${{ !failure() && !cancelled() && needs.changes.outputs.images == 'true' }}
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    env:
      PUBLISH: ${{ needs.stamp.outputs.publish }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Stamp the build's version
        env:
          PA_VERSION: ${{ needs.stamp.outputs.version }}
        run: sh scripts/ci/stamp-version.sh "$PA_VERSION"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        if: env.PUBLISH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/rikiku/pagerarchive-client
      # Each architecture is built natively and pushed by digest; the next
      # job joins them into one multi-arch tag.
      # Retried when it publishes (ADR 0025).
      - id: build
        uses: ./.github/actions/build-push
        with:
          retry: ${{ env.PUBLISH == 'true' }}
          context: .
          file: Dockerfile.client
          platforms: linux/${{ matrix.arch }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=ghcr.io/rikiku/pagerarchive-client,push-by-digest=true,name-canonical=true,push=${{ env.PUBLISH }}
      - name: Keep the digest
        if: env.PUBLISH == 'true'
        run: |
          mkdir -p digests
          touch "digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
      - uses: ./.github/actions/upload
        if: env.PUBLISH == 'true'
        with:
          name: client-digest-${{ matrix.arch }}
          path: digests/*
          retention-days: 1

  publish-client-manifest:
    name: Publish client image (amd64 + arm64)
    needs: [stamp, publish-client, release]
    if: ${{ !failure() && !cancelled() && needs.stamp.outputs.publish == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    env:
      RELEASE: ${{ needs.stamp.outputs.mode == 'release' }}
      MAIN: ${{ needs.stamp.outputs.mode == 'main' }}
    steps:
      # The checkout is for scripts/ci's retries (ADR 0025).
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Stamp the build's version
        env:
          PA_VERSION: ${{ needs.stamp.outputs.version }}
        run: sh scripts/ci/stamp-version.sh "$PA_VERSION"
      # The digests, tried up to 3 times (GitHub's artifact service, ADR 0025).
      - id: digests
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: digests
          pattern: client-digest-*
          merge-multiple: true
      - if: steps.digests.outcome == 'failure'
        run: sleep 15
      - id: digests-again
        if: steps.digests.outcome == 'failure'
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: digests
          pattern: client-digest-*
          merge-multiple: true
      - if: steps.digests-again.outcome == 'failure'
        run: sleep 45
      - if: steps.digests-again.outcome == 'failure'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: digests
          pattern: client-digest-*
          merge-multiple: true
      - if: steps.digests.outcome == 'failure'
        env:
          HOW: passed on try ${{ steps.digests-again.outcome == 'success' && '2' || '3' }} of 3
        run: sh scripts/ci/flaky.sh "download-artifact client-digest-*" "$HOW"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/rikiku/pagerarchive-client
          tags: |
            type=raw,value=${{ needs.stamp.outputs.version }},enable=${{ env.RELEASE }}
            type=raw,value=${{ needs.stamp.outputs.major_minor }},enable=${{ env.RELEASE }}
            type=raw,value=latest,enable=${{ env.RELEASE }}
            type=raw,value=main,enable=${{ env.MAIN }}
            type=sha,prefix=sha-,format=short,enable=${{ env.RELEASE != 'true' }}
      - name: Join the architectures under the tags
        working-directory: digests
        # Joining the same digests under the same tags again is a no-op.
        run: |
          # shellcheck disable=SC2046 # each tag and digest is its own word
          sh ../scripts/ci/retry.sh -l "docker buildx imagetools create" docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<<"$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf 'ghcr.io/rikiku/pagerarchive-client@sha256:%s ' *)
          sh ../scripts/ci/retry.sh docker buildx imagetools inspect ghcr.io/rikiku/pagerarchive-client:${{ steps.meta.outputs.version }}

  # What a deployment needs (R84): only once this release's images are on GHCR,
  # for anyone to pull, so an attached compose.yaml never names an image that
  # isn't there yet (owner, 2026-11-03; ADR 0019). Only then does the release
  # become the latest, so the docs' releases/latest/download links keep getting
  # the previous release's files until this one's are all in place. Re-run after
  # a failure, it finishes the job. The files are this checkout's, stamped with
  # the release's version, so compose.yaml names its MAJOR.MINOR (ADR 0024). In
  # a dry run it makes and lists them, and attaches nothing.
  attach-release-files:
    name: Attach the install and upgrade files, and make it the latest release
    needs: [release, publish-server, publish-client-manifest]
    if: ${{ !failure() && !cancelled() && needs.release.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ needs.release.outputs.tag }}
      MAJOR_MINOR: ${{ needs.release.outputs.major_minor }}
      PA_VERSION: ${{ needs.release.outputs.version }}
      DRY_RUN: ${{ needs.release.outputs.dry_run }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Stamp the build's version
        run: sh scripts/ci/stamp-version.sh "$PA_VERSION"
      # No docker login in this job: this is what anyone pulling sees.
      - name: The release's images are on GHCR
        if: env.DRY_RUN != 'true'
        run: |
          sh scripts/ci/retry.sh sh -c 'docker manifest inspect "ghcr.io/rikiku/pagerarchive:$MAJOR_MINOR" >/dev/null'
          sh scripts/ci/retry.sh sh -c 'docker manifest inspect "ghcr.io/rikiku/pagerarchive-client:$MAJOR_MINOR" >/dev/null'
      - name: The files for installing and upgrading
        run: sh scripts/ci/release-assets.sh dist
      - name: Attach them, check they're there, and make it the latest release
        if: env.DRY_RUN != 'true'
        run: |
          sh scripts/ci/retry.sh gh release upload "$TAG" dist/* --clobber
          attached=$(gh release view "$TAG" --json assets --jq '.assets[].name')
          for asset in $(sh scripts/ci/release-assets.sh --list); do
            printf '%s\n' "$attached" | grep -qx "$asset" || { echo "::error::$TAG has no $asset attached"; exit 1; }
          done
          sh scripts/ci/retry.sh gh release edit "$TAG" --latest
      - name: Dry run, so nothing attached
        if: env.DRY_RUN == 'true'
        run: |
          echo "dry run: would attach these to $TAG, then make it the latest release:"
          ls -l dist
          echo "--- its compose.yaml: $(grep 'ghcr.io/rikiku/pagerarchive:' dist/compose.yaml)"

  # The PowerShell module on the PowerShell Gallery (R63): only from a release
  # whose plan said "publish" (powershell/PagerArchive/ changed since the
  # previous release and the manifest's version isn't on the Gallery yet),
  # with the manifest's own version, not the release's. Otherwise it's
  # skipped, and the release job's log and the release notes say "module
  # unchanged: the Gallery keeps <version>". Without the PSGALLERY_API_KEY
  # secret it fails, since the release notes already say the module is
  # published (owner, 2026-11-02). Re-run after a failure, it publishes the
  # version, or finds it already there. Never in a dry run.
  publish-powershell:
    name: Publish the PowerShell module to the PowerShell Gallery
    needs: [stamp, release]
    if: needs.release.outputs.module == 'publish' && needs.stamp.outputs.mode == 'release'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PSGALLERY_API_KEY: ${{ secrets.PSGALLERY_API_KEY }}
      MODULE_VERSION: ${{ needs.release.outputs.module_version }}
    steps:
      - name: The Gallery key is set
        run: |
          if [ -z "$PSGALLERY_API_KEY" ]; then
            echo "::error::The PSGALLERY_API_KEY secret isn't set, so PagerArchive $MODULE_VERSION can't be published: set the secret (Settings, Secrets and variables, Actions), then re-run this job."
            exit 1
          fi
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Check the manifest and publish its version
        shell: pwsh
        run: |
          $manifest = Test-ModuleManifest -Path powershell/PagerArchive/PagerArchive.psd1 -ErrorAction Stop
          $manifest | Format-List -Property Name, Version, PowerShellVersion, CompatiblePSEditions
          if ("$($manifest.Version)" -ne $env:MODULE_VERSION) {
              throw "The manifest says $($manifest.Version), the release's plan $env:MODULE_VERSION"
          }
          $published = Find-PSResource -Name PagerArchive -Version $env:MODULE_VERSION -Repository PSGallery -ErrorAction SilentlyContinue
          if ($published) {
              Write-Output -InputObject "PagerArchive $env:MODULE_VERSION is on the Gallery already (an earlier attempt published it)"
          } else {
              Publish-PSResource -Path powershell/PagerArchive -Repository PSGallery -ApiKey $env:PSGALLERY_API_KEY
              Write-Output -InputObject "Published PagerArchive $env:MODULE_VERSION"
          }
