name: Maintenance

# R85-R85c (ADR 0022): Renovate, run here with the maintenance app's token, opens
# and rebases the update pull requests in .github/renovate.json5. Each rule's
# schedule there says which day a pull request may open: base images any day,
# third-party images on Mondays, libraries on the 1st. This runs daily, and
# after every push to main, so a pull request left behind main is rebased (and
# its VERSION raised again) soon after another merges.
#
# The app's token, not GITHUB_TOKEN: pushes, and merges GitHub makes for
# auto-merge, made with GITHUB_TOKEN start no workflow, so CI would never run
# on the branch, nor the release on main.
#
# By hand (Actions, Maintenance, Run workflow), "dry_run" set to "full" logs
# every branch and pull request it would make or merge, and makes none (A79).
on:
  schedule:
    - cron: "17 3 * * *"
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Renovate's dryRun: off for a real run, or full or lookup"
        required: false
        default: "off"
        type: choice
        options: ["off", full, lookup]
      log_level:
        description: "info or debug"
        required: false
        default: info
        type: choice
        options: [info, debug]

permissions:
  contents: read

concurrency:
  group: maintenance
  cancel-in-progress: false

jobs:
  renovate:
    name: Renovate (base images, libraries, third-party images)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: The app's secrets are set
        env:
          APP_ID: ${{ vars.MAINTENANCE_APP_ID }}
          APP_KEY: ${{ secrets.MAINTENANCE_APP_PRIVATE_KEY }}
        run: |
          if [ -z "$APP_ID" ] || [ -z "$APP_KEY" ]; then
            echo "::error::The MAINTENANCE_APP_ID variable or the MAINTENANCE_APP_PRIVATE_KEY secret isn't set (Settings, Secrets and variables, Actions; ADR 0022), so nothing is updated."
            exit 1
          fi
      - id: app
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.MAINTENANCE_APP_ID }}
          private-key: ${{ secrets.MAINTENANCE_APP_PRIVATE_KEY }}
      - uses: renovatebot/github-action@v46.3.12
        with:
          renovate-version: 44.222.4
          token: ${{ steps.app.outputs.token }}
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_ONBOARDING: "false"
          RENOVATE_REQUIRE_CONFIG: required
          # The only command an update may run: raising VERSION (R85c).
          RENOVATE_ALLOWED_COMMANDS: '["^sh scripts/ci/bump-version\\.sh$"]'
          RENOVATE_DRY_RUN: ${{ inputs.dry_run != 'off' && inputs.dry_run || '' }}
          LOG_LEVEL: ${{ inputs.log_level || 'info' }}
