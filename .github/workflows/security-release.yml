name: Security release

# A security update is released straight away (SPEC.md 12.1, ADR 0024): when
# a pull request labelled "security" merges into main (Renovate labels its
# vulnerability alerts' pull requests so, .github/renovate.json5), this starts
# the Release workflow on main, as "Release now" would. A workflow_dispatch
# made with GITHUB_TOKEN does start a run (GitHub's one exception, with
# repository_dispatch).
#
# Security updates that merge close together go out as one release (owner,
# 2026-11-12; ADR 0024's section of that date): the run waits 30 minutes
# before starting the Release workflow, and a second security merge inside
# that time cancels the waiting run and starts the wait again, so the one
# release has both. (On 2026-11-12 two security merges 18 minutes apart made
# two releases, v1.7.7 and v1.7.8.)
# Only a merged security pull request's run joins that concurrency group:
# every other closed pull request's run has a group of its own, so it never
# cancels a wait.
#
# Its own workflow, not a trigger of release.yml: that one's runs wait for
# each other, and a run for every closed pull request there could replace a
# release that's waiting.
on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.event.pull_request.merged == true && contains(github.event.pull_request.labels.*.name, 'security') && 'security-release' || format('security-release-not-{0}', github.run_id) }}
  cancel-in-progress: true

jobs:
  release:
    name: Start the Release workflow, 30 minutes after the last security merge
    if: github.event.pull_request.merged == true && contains(github.event.pull_request.labels.*.name, 'security')
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      actions: write
      contents: read
    steps:
      # For scripts/ci/retry.sh (ADR 0025).
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Wait 30 minutes for another security merge
        env:
          PR: ${{ github.event.pull_request.html_url }}
        run: |
          echo "::notice::Security update merged ($PR): the Release workflow starts on main in 30 minutes, unless another security update merges first (then it waits for that one)."
          sleep 1800
      - name: Release main now
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.html_url }}
        run: |
          sh scripts/ci/retry.sh gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref main
          echo "::notice::Security update merged ($PR): the Release workflow is started on main."
