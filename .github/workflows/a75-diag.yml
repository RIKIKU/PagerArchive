name: A75 diag (temporary)
on:
  push:
    branches: ["fix-a75-cold"]
    paths: ["internal/acceptance/a75diag_test.go", ".github/workflows/a75-diag.yml"]
jobs:
  diag:
    name: A75 diag ${{ matrix.n }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        n: [1, 2, 3, 4, 5, 6]
    services:
      postgres:
        image: postgis/postgis:18-3.6
        env:
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    env:
      PAGERARCHIVE_TEST_DATABASE_URL: postgres://postgres:test@localhost:5432/postgres?sslmode=disable
      PAGERARCHIVE_REQUIRE_DB: "1"
      PAGERARCHIVE_A75_DIAG: "1"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - name: Machine
        run: lscpu | head -20; lsblk; findmnt /; df -h /; cat /sys/block/*/queue/scheduler; nproc; free -m
      - name: Diag
        env:
          PAGERARCHIVE_A75_CONTAINER: ${{ job.services.postgres.id }}
        run: go test -count=1 -v -timeout 35m -run TestA75Diag ./internal/acceptance/
