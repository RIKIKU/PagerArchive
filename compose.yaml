# PagerArchive server stack (SPEC.md section 5, R84). Attached to every
# release, with env.example and pagerarchive-config.tar.gz: no other file from
# the repository is needed. docs/deploy.md has the steps:
#
#   tar -xzf pagerarchive-config.tar.gz   # next to this file
#   cp env.example .env                   # fill it in
#   docker compose up -d
#
# Every image is named by its major.minor tag, so this gets patch releases:
#
#   docker compose pull && docker compose up -d
#
# A new minor or major version also needs that release's compose.yaml and
# archive first.
#
# Don't edit this file, because an upgrade replaces it. Site-specific changes
# go in a compose.override.yaml next to it (docs/deploy.md, "Your own changes").
#
# Your own reverse proxy (TLS) forwards APP_URL to `api` and AUTHENTIK_URL,
# a separate subdomain, to `authentik-server` (R40).
name: pagerarchive

x-authentik: &authentik
  image: ghcr.io/goauthentik/server:2026.5
  restart: unless-stopped
  # A hash of the files mounted below. Compose doesn't notice a changed file,
  # but a changed label makes `docker compose up -d` recreate the container,
  # so a release's new files take effect (R84a, ADR 0019). A test checks it
  # and prints the right value.
  labels:
    pagerarchive.config: "c7ec6a6cd10e38d3"
  environment:
    AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY:?set AUTHENTIK_SECRET_KEY in .env}
    AUTHENTIK_POSTGRESQL__HOST: db
    AUTHENTIK_POSTGRESQL__NAME: authentik
    AUTHENTIK_POSTGRESQL__USER: authentik
    AUTHENTIK_POSTGRESQL__PASSWORD: ${AUTHENTIK_DB_PASSWORD:?set AUTHENTIK_DB_PASSWORD in .env}
    # TCP keepalives, so a database connection that died without being
    # closed fails within about a minute and Authentik reconnects (ADR 0008
    # §11). Base64 of:
    # {"keepalives":1,"keepalives_idle":30,"keepalives_interval":10,"keepalives_count":3,"tcp_user_timeout":60000}
    AUTHENTIK_POSTGRESQL__CONN_OPTIONS: eyJrZWVwYWxpdmVzIjoxLCJrZWVwYWxpdmVzX2lkbGUiOjMwLCJrZWVwYWxpdmVzX2ludGVydmFsIjoxMCwia2VlcGFsaXZlc19jb3VudCI6MywidGNwX3VzZXJfdGltZW91dCI6NjAwMDB9
    AUTHENTIK_EMAIL__HOST: ${SMTP_HOST:?set SMTP_HOST in .env}
    AUTHENTIK_EMAIL__PORT: ${SMTP_PORT:-587}
    AUTHENTIK_EMAIL__USERNAME: ${SMTP_USERNAME:-}
    AUTHENTIK_EMAIL__PASSWORD: ${SMTP_PASSWORD:-}
    AUTHENTIK_EMAIL__USE_TLS: ${SMTP_USE_TLS:-true}
    AUTHENTIK_EMAIL__USE_SSL: ${SMTP_USE_SSL:-false}
    AUTHENTIK_EMAIL__FROM: ${SMTP_FROM:?set SMTP_FROM in .env}
    # Authentik's own administrator (akadmin), for the deployment's operator.
    AUTHENTIK_BOOTSTRAP_EMAIL: ${AUTHENTIK_ADMIN_EMAIL:?set AUTHENTIK_ADMIN_EMAIL in .env}
    AUTHENTIK_BOOTSTRAP_PASSWORD: ${AUTHENTIK_ADMIN_PASSWORD:?set AUTHENTIK_ADMIN_PASSWORD in .env}
    # Nothing leaves the deployment: no avatars from third parties, no
    # analytics, error reports or update checks.
    AUTHENTIK_AVATARS: initials
    AUTHENTIK_ERROR_REPORTING__ENABLED: "false"
    AUTHENTIK_DISABLE_STARTUP_ANALYTICS: "true"
    AUTHENTIK_DISABLE_UPDATE_CHECK: "true"
    # Read by deploy/authentik/blueprints/pagerarchive.yaml.
    PA_APP_URL: ${APP_URL:?set APP_URL in .env}
    PA_OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:?set OIDC_CLIENT_SECRET in .env}
    PA_AUTHENTIK_API_TOKEN: ${AUTHENTIK_API_TOKEN:?set AUTHENTIK_API_TOKEN in .env}
  # File by file, from the release's archive: a file a later release drops
  # can't stay in use because it's still in the folder (ADR 0019).
  volumes:
    - ./deploy/authentik/blueprints/pagerarchive.yaml:/blueprints/pagerarchive/pagerarchive.yaml:ro
    - ./deploy/authentik/templates/pagerarchive/code.html:/templates/pagerarchive/code.html:ro
    - ./deploy/authentik/templates/pagerarchive/code.txt:/templates/pagerarchive/code.txt:ro
    - ./deploy/authentik/templates/pagerarchive/invitation.html:/templates/pagerarchive/invitation.html:ro
    - ./deploy/authentik/templates/pagerarchive/invitation.txt:/templates/pagerarchive/invitation.txt:ro
  depends_on:
    db:
      condition: service_healthy
      # When Compose restarts or recreates db (an upgrade, `docker compose
      # restart db`), it restarts Authentik too, so Authentik never keeps
      # connections to the old database (ADR 0008 §11). After a crash or a
      # reboot, restart it by hand: see docs/deploy.md.
      restart: true

services:
  db:
    image: postgis/postgis:18-3.6
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      AUTHENTIK_DB_PASSWORD: ${AUTHENTIK_DB_PASSWORD:?set AUTHENTIK_DB_PASSWORD in .env}
    # P1: statement text (which can contain page text) is never logged.
    command: >-
      postgres -c log_statement=none -c log_min_error_statement=panic -c log_error_verbosity=terse
      -c shared_buffers=128MB -c work_mem=4MB -c max_connections=100
    volumes:
      - db:/var/lib/postgresql
      # Runs once, when the volume is new, so it has no label: a change to it
      # means nothing to a database that already exists.
      - ./deploy/postgres/10-authentik.sh:/docker-entrypoint-initdb.d/10-authentik.sh:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-h", "127.0.0.1"]
      interval: 5s
      retries: 30

  authentik-server:
    <<: *authentik
    command: server
    ports:
      - "${AUTHENTIK_BIND:-127.0.0.1:9000}:9000"

  authentik-worker:
    <<: *authentik
    command: worker

  api:
    # This minor version's image. `docker compose pull` gets its patch releases;
    # the next minor version's compose.yaml moves a deployment on (R84a, R84b).
    image: ghcr.io/rikiku/pagerarchive:0.18
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@db:5432/postgres?sslmode=disable
      PROFILES_DIR: /profiles
      TZ: ${TZ:-UTC}
      APP_URL: ${APP_URL}
      AUTHENTIK_URL: ${AUTHENTIK_URL:?set AUTHENTIK_URL in .env}
      AUTHENTIK_INTERNAL_URL: http://authentik-server:9000
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET}
      AUTHENTIK_API_TOKEN: ${AUTHENTIK_API_TOKEN}
      ALLOWED_EMAIL_DOMAINS: ${ALLOWED_EMAIL_DOMAINS:?set ALLOWED_EMAIL_DOMAINS in .env}
      INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL:-}
      NIGHTLY_AT: ${NIGHTLY_AT:-03:00}
      MAP_TILES: /map/tiles.pmtiles
      MAP_ATTRIBUTION: ${MAP_ATTRIBUTION:-}
      # Integrations (docs/integrations.md) and metrics (docs/deploy.md).
      INTEGRATION_SECRETS_KEY: ${INTEGRATION_SECRETS_KEY:-}
      INTEGRATION_SECRETS_KEY_OLD: ${INTEGRATION_SECRETS_KEY_OLD:-}
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      # Telemetry over OTLP (docs/monitoring.md): off unless set.
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_RESOURCE_ATTRIBUTES: ${OTEL_RESOURCE_ATTRIBUTES:-}
      AUTHENTIK_METRICS_DB_PASSWORD: ${AUTHENTIK_METRICS_DB_PASSWORD:-}
      # What the backup service last did (R86a). The API never sees the dumps.
      BACKUP_STATUS_FILE: /backup-status/status.json
    volumes:
      # Your network's profile and your map extract. With neither set, /dev/null
      # is mounted instead, and the API uses the made-up example built into
      # its image, with a warning on every start for the profile (R84).
      - ${PROFILES_DIR:-/dev/null}:/profiles:ro
      - ${MAP_TILES_FILE:-/dev/null}:/map/tiles.pmtiles:ro
      - backup-status:/backup-status:ro
    ports:
      - "${API_BIND:-127.0.0.1:8080}:8080"
    depends_on:
      db:
        condition: service_healthy

  # Nightly dumps of both databases into BACKUP_DIR (R86, ADR 0020), by upstream's
  # image and a script from the archive. docs/deploy.md, "Backups".
  backup:
    image: postgis/postgis:18-3.6
    restart: unless-stopped
    entrypoint: [sh, /usr/local/bin/pagerarchive-backup]
    command: [serve]
    labels:
      pagerarchive.config: "574d7ddcf357665c"
    environment:
      PGHOST: db
      PGUSER: postgres
      PGPASSWORD: ${POSTGRES_PASSWORD}
      TZ: ${TZ:-UTC}
      BACKUP_AT: ${BACKUP_AT:-04:00}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      BACKUP_UID: ${BACKUP_UID:-0}
      BACKUP_GID: ${BACKUP_GID:-0}
    volumes:
      - ./deploy/backup/backup.sh:/usr/local/bin/pagerarchive-backup:ro
      - ${BACKUP_DIR:-./backups}:/backups
      - backup-status:/status
    depends_on:
      db:
        condition: service_healthy

  # Restores each night's dumps into a throwaway database and compares them
  # (R86a). No network and no secrets: it sees only the backup folder.
  backup-check:
    image: postgis/postgis:18-3.6
    restart: unless-stopped
    network_mode: none
    entrypoint: [sh, /usr/local/bin/pagerarchive-backup]
    command: [check-serve]
    labels:
      pagerarchive.config: "574d7ddcf357665c"
    environment:
      BACKUP_UID: ${BACKUP_UID:-0}
      BACKUP_GID: ${BACKUP_GID:-0}
    volumes:
      - ./deploy/backup/backup.sh:/usr/local/bin/pagerarchive-backup:ro
      - ${BACKUP_DIR:-./backups}:/backups
      - backup-check:/var/lib/postgresql

volumes:
  db:
  backup-status:
  backup-check:
